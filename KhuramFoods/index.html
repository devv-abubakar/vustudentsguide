<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Khuram Foods - Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen">

<div class="app-container relative min-h-screen flex flex-col" id="app" style="display:none!important">

  <header class="header-bg text-white px-4 py-3 flex items-center justify-between z-30 sticky top-0" style="min-height:56px">
    <button id="backBtn" class="hidden mr-2 w-8 h-8 flex items-center justify-center rounded-full bg-white/20 active:bg-white/30" onclick="goBack()">
      <i class="fa fa-arrow-left text-sm"></i>
    </button>
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <span id="headerLogo" class="text-xl font-heading font-bold tracking-tight">🌶 Khuram Foods</span>
      <span id="headerTitle" class="text-base font-semibold truncate hidden"></span>
    </div>
    <button onclick="logout()" class="flex items-center gap-1.5 text-sm bg-white/20 px-3 py-1.5 rounded-full font-medium active:bg-white/30">
      <i class="fa fa-sign-out-alt text-xs"></i> Logout
    </button>
  </header>

  <main class="flex-1 overflow-y-auto pb-24" id="mainContent">

    <div class="view active" id="view-dashboard">
      <div class="px-4 pt-4 pb-2">
        <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2">Cash Flow Summary</p>
        
        <div class="flex gap-3 mb-4 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex-1">
            <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1 block">Start Date</label>
            <input type="date" id="dashStartDate" class="w-full border-2 border-gray-100 rounded-xl bg-gray-50 text-xs py-2 px-2 font-bold text-gray-700 shadow-sm" onchange="loadDashboard()" />
          </div>
          <div class="flex-1">
            <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1 block">End Date</label>
            <input type="date" id="dashEndDate" class="w-full border-2 border-gray-100 rounded-xl bg-gray-50 text-xs py-2 px-2 font-bold text-gray-700 shadow-sm" onchange="loadDashboard()" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="stat-debit text-white rounded-2xl p-4 tap-card" onclick="filterDashList('debit')">
            <p class="text-[11px] font-bold opacity-90 mb-1 uppercase tracking-wider">Cash Paid</p>
            <p class="text-xl sm:text-2xl font-heading font-bold" id="dashDebit">...</p>
            <p class="text-[10px] opacity-70 mt-1">To Payables</p>
          </div>
          <div class="stat-credit text-white rounded-2xl p-4 tap-card" onclick="filterDashList('credit')">
            <p class="text-[11px] font-bold opacity-90 mb-1 uppercase tracking-wider">Cash Received</p>
            <p class="text-xl sm:text-2xl font-heading font-bold" id="dashCredit">...</p>
            <p class="text-[10px] opacity-70 mt-1">From Receivables</p>
          </div>
        </div>

        <div class="flex justify-between items-center mb-3 border-b border-gray-200 pb-2">
          <p class="text-sm text-gray-800 font-heading font-bold uppercase tracking-wider" id="dashListTitle">All Cash Transactions</p>
          <button onclick="filterDashList('all')" class="text-xs text-white bg-rose-500 px-3 py-1 rounded-full font-bold hidden shadow-sm" id="dashClearFilter">Clear Filter</button>
        </div>
        <div id="dashTxList" class="space-y-4"></div>
      </div>
    </div>

    <div class="view" id="view-payables">
      <div class="px-4 pt-4">
        <div class="flex gap-2 mb-4">
          <div class="search-wrap flex-1">
            <i class="fa fa-search text-xs"></i>
            <input type="text" placeholder="Search Payables..." id="searchPayable" class="w-full border border-gray-200 rounded-xl bg-white text-sm py-3 px-4 pl-9 shadow-sm font-medium" oninput="filterClients('payable')" />
          </div>
          <button onclick="openAddClientModal('payable')" class="bg-rose-500 text-white px-4 rounded-xl shadow-sm"><i class="fa fa-plus"></i></button>
        </div>
        <div id="listPayable" class="space-y-3"></div>
      </div>
    </div>

    <div class="view" id="view-receivables">
      <div class="px-4 pt-4">
        <div class="flex gap-2 mb-4">
          <div class="search-wrap flex-1">
            <i class="fa fa-search text-xs"></i>
            <input type="text" placeholder="Search Receivables..." id="searchReceivable" class="w-full border border-gray-200 rounded-xl bg-white text-sm py-3 px-4 pl-9 shadow-sm font-medium" oninput="filterClients('receivable')" />
          </div>
          <button onclick="openAddClientModal('receivable')" class="bg-rose-500 text-white px-4 rounded-xl shadow-sm"><i class="fa fa-plus"></i></button>
        </div>
        <div id="listReceivable" class="space-y-3"></div>
      </div>
    </div>

    <div class="view" id="view-ledger">
      <div class="px-4 pt-4">
        <div id="ledgerClientCard" class="bg-white rounded-2xl p-4 mb-5 shadow-md border border-gray-100">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-rose-50 flex items-center justify-center border border-rose-100"><i class="fa fa-user text-rose-500 text-2xl"></i></div>
            <div class="flex-1 min-w-0">
              <p class="font-heading font-bold text-gray-800 text-xl truncate" id="ledgerClientName">-</p>
              <p class="text-sm font-medium text-gray-500 mt-0.5" id="ledgerClientPhone">-</p>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
            <p class="text-xs uppercase font-bold text-gray-400">Running Balance</p>
            <p class="font-heading font-bold text-xl balance-chip" id="ledgerBalance">-</p>
          </div>
        </div>
        <p class="text-sm text-gray-800 font-heading font-bold uppercase tracking-wider mb-3 border-b border-gray-200 pb-2">Ledger Details</p>
        <div id="ledgerTxList" class="space-y-4 pb-4"></div>
      </div>
    </div>

    <div class="view" id="view-admin">
      <div class="px-4 pt-4 space-y-6">
        
        <div class="bg-white rounded-2xl p-5 shadow-md border border-gray-100">
          <h3 class="font-heading font-bold text-gray-800 text-lg mb-4 border-b pb-2">1. Add Bora / Rate</h3>
          <div class="space-y-3">
            <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Bora Name</label><input type="text" id="adminBoraName" placeholder="e.g. Nimko" class="w-full border-2 border-gray-200 rounded-xl py-2.5 px-3 text-sm bg-gray-50 font-bold text-gray-800" /></div>
            <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Packets in Bora</label><input type="number" id="adminPackets" placeholder="e.g. 24" class="w-full border-2 border-gray-200 rounded-xl py-2.5 px-3 text-sm bg-gray-50 font-bold text-gray-800" /></div>
            <div><label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Rate per Bora (Rs)</label><input type="number" id="adminRate" placeholder="0" class="w-full border-2 border-gray-200 rounded-xl py-2.5 px-3 text-lg bg-gray-50 font-black text-rose-500" /></div>
            <button onclick="submitNewRate()" class="w-full bg-rose-500 text-white py-3 rounded-xl font-bold shadow-sm active:bg-rose-600 mt-2">Save Rate</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-5 shadow-md border border-gray-100 mb-6">
          <h3 class="font-heading font-bold text-gray-800 text-lg mb-4 border-b pb-2">2. Add Transaction</h3>
          <div class="space-y-4">
            
            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Select Ledger Type</label>
              <select id="adminLedgerType" onchange="handleAdminLedgerType()" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-white font-bold text-blue-600">
                <option value="receivable" selected>Receivable</option>
                <option value="payable">Payable</option>
              </select>
            </div>

            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Select Action</label>
              <select id="adminActionType" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-white font-bold text-rose-600">
                </select>
            </div>

            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Search & Select Client</label>
              <select id="adminClientSelect" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-bold text-gray-800">
                </select>
            </div>

            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Date</label>
              <input type="date" id="adminDate" class="w-full border-2 border-gray-200 rounded-xl py-2.5 px-3 text-sm bg-gray-50 font-bold text-gray-800" />
            </div>

            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Remarks / Details</label>
              <textarea id="adminRemarks" rows="2" placeholder="Bundle count or Cash note..." class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-semibold"></textarea>
            </div>
            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Total Amount (Rs)</label>
              <input type="number" id="adminTotalAmount" placeholder="0" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-2xl bg-white font-black text-green-600 shadow-inner" />
            </div>

            <button onclick="submitAdminTransaction()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-md active:bg-green-700 mt-2 text-lg"><i class="fa fa-check-circle mr-2"></i> Submit Transaction</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30 shadow-[0_-4px_24px_rgba(0,0,0,0.08)] app-container">
    <div class="flex">
      <button class="nav-btn active flex-1 flex flex-col items-center py-3.5 gap-1.5" data-view="dashboard" onclick="switchView('dashboard')">
        <i class="nav-icon fa fa-chart-bar text-gray-400 text-xl transition-all"></i>
        <span class="nav-label text-[10px] text-gray-400 uppercase tracking-wide font-semibold">Dash</span>
      </button>
      <button class="nav-btn flex-1 flex flex-col items-center py-3.5 gap-1.5" data-view="payables" onclick="switchView('payables')">
        <i class="nav-icon fa fa-hand-holding-dollar text-gray-400 text-xl transition-all"></i>
        <span class="nav-label text-[10px] text-gray-400 uppercase tracking-wide font-semibold">Payables</span>
      </button>
      <button class="nav-btn flex-1 flex flex-col items-center py-3.5 gap-1.5" data-view="receivables" onclick="switchView('receivables')">
        <i class="nav-icon fa fa-file-invoice-dollar text-gray-400 text-xl transition-all"></i>
        <span class="nav-label text-[10px] text-gray-400 uppercase tracking-wide font-semibold">Receives</span>
      </button>
      <button class="nav-btn flex-1 flex flex-col items-center py-3.5 gap-1.5" data-view="admin" onclick="switchView('admin')">
        <i class="nav-icon fa fa-cog text-gray-400 text-xl transition-all"></i>
        <span class="nav-label text-[10px] text-gray-400 uppercase tracking-wide font-semibold">Admin</span>
      </button>
    </div>
  </nav>
</div>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center px-6 bg-gradient-to-br from-rose-600 via-rose-500 to-pink-500 app-container">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-24 h-24 bg-white/20 rounded-3xl flex items-center justify-center mx-auto mb-5 text-5xl shadow-lg border border-white/30">🌶</div>
      <h1 class="text-4xl font-heading font-extrabold text-white tracking-tight">Khuram Foods</h1>
      <p class="text-rose-100 text-sm mt-2 font-medium tracking-wide">Secure Admin Portal</p>
    </div>
    <div class="bg-white rounded-[2rem] p-7 shadow-2xl">
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-2">Username</label>
          <input type="text" id="loginUser" placeholder="Enter username" class="w-full border border-gray-200 rounded-xl py-3.5 px-4 text-sm bg-gray-50 font-bold text-gray-700" />
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-2">Password</label>
          <input type="password" id="loginPass" placeholder="Enter password" class="w-full border border-gray-200 rounded-xl py-3.5 px-4 text-sm bg-gray-50 font-bold text-gray-700" onkeydown="if(event.key==='Enter')doLogin()"/>
        </div>
        <div id="loginError" class="hidden text-rose-500 text-xs text-center font-bold bg-rose-50 rounded-lg py-2.5 border border-rose-100"></div>
        <button onclick="doLogin()" id="loginBtn" class="w-full bg-rose-500 text-white py-4 rounded-xl font-heading font-bold text-sm mt-2 shadow-md active:bg-rose-600">Access Portal</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full text-white text-sm font-bold shadow-2xl flex items-center gap-2 whitespace-nowrap border border-white/20"></div>

<div id="modalBackdrop" class="modal-backdrop fixed inset-0 bg-black/50 z-50 hidden flex items-end justify-center sm:items-center">
  <div id="modalBox" class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-3xl p-6 pb-8 shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/clients.js"></script>
<script src="js/ledger.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
