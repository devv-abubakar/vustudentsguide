<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Khuram Foods - Daily Receivings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'DM Sans', sans-serif; background: #f3f4f6; overscroll-behavior: none; }
    h1,h2,h3,.font-heading { font-family: 'Sora', sans-serif; }

    /* Toast */
    #toast { transition: all 0.3s ease; transform: translateY(100px); opacity: 0; }
    #toast.show { transform: translateY(0); opacity: 1; }

    /* Modal */
    .modal-backdrop { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* Floating Action Button */
    .fab { box-shadow: 0 8px 30px rgba(244,63,94,0.4); transition: transform 0.2s ease; }
    .fab:active { transform: scale(0.92); }

    /* Focus */
    input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(244,63,94,0.15); border-color: #f43f5e; }

    /* Header Background */
    .header-bg {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      position: relative;
      overflow: hidden;
    }
    .header-bg::after {
      content: ''; position: absolute; right: -20px; top: -20px; width: 150px; height: 150px;
      border-radius: 50%; background: rgba(255,255,255,0.06);
    }
    .header-bg::before {
      content: ''; position: absolute; right: 40px; top: 10px; width: 80px; height: 80px;
      border-radius: 50%; background: rgba(255,255,255,0.08);
    }

    /* Card Layouts */
    .stat-card {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      position: relative; overflow: hidden;
    }
    .stat-card::after {
      content: '\f0d6'; font-family: "Font Awesome 6 Free"; font-weight: 900;
      position: absolute; right: -15px; bottom: -20px; font-size: 100px;
      color: rgba(255,255,255,0.1); transform: rotate(-15deg);
    }

    /* Spinner */
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile wrapper constraints */
    @media (min-width: 480px) {
      .app-container { max-width: 420px; margin: 0 auto; background: #fff; box-shadow: 0 0 30px rgba(0,0,0,0.08); min-height: 100vh; }
      body { background: #e2e8f0; }
    }
  </style>
</head>
<body>

<div class="app-container relative flex flex-col" id="app" style="display:none!important">

  <header class="header-bg text-white px-5 py-4 flex items-center justify-between z-30 sticky top-0 shadow-md">
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm shadow-inner">
        <span class="text-xl">🌶</span>
      </div>
      <span class="text-xl font-heading font-extrabold tracking-tight">Khuram Foods</span>
    </div>
    <button onclick="logout()" class="flex items-center gap-1.5 text-sm bg-white/10 hover:bg-white/20 px-3 py-2 rounded-lg font-bold transition-colors">
      <i class="fa fa-sign-out-alt text-sm"></i>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto px-4 pt-5 pb-28">

    <div class="bg-white rounded-[1.25rem] p-4 shadow-sm border border-gray-100 mb-5">
      <div class="flex gap-4">
        <div class="flex-1">
          <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1.5 block ml-1">Start Date</label>
          <div class="relative">
            <input type="date" id="dashStartDate" class="w-full border-2 border-gray-100 rounded-xl bg-gray-50 text-xs py-2.5 px-3 font-bold text-gray-800 shadow-inner" onchange="loadDashboard()" />
          </div>
        </div>
        <div class="flex-1">
          <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1.5 block ml-1">End Date</label>
          <div class="relative">
            <input type="date" id="dashEndDate" class="w-full border-2 border-gray-100 rounded-xl bg-gray-50 text-xs py-2.5 px-3 font-bold text-gray-800 shadow-inner" onchange="loadDashboard()" />
          </div>
        </div>
      </div>
    </div>

    <div class="stat-card text-white rounded-[1.5rem] p-6 shadow-lg mb-6">
      <p class="text-[12px] font-bold opacity-90 mb-1 uppercase tracking-widest flex items-center gap-2">
        <i class="fa fa-chart-pie"></i> Total Received Amount
      </p>
      <p class="text-4xl font-heading font-black tracking-tight" id="dashTotal">...</p>
      <p class="text-[11px] opacity-75 mt-2 font-medium" id="dashDateRangeText">Loading dates...</p>
    </div>

    <div class="flex justify-between items-center mb-4 px-1">
      <h3 class="text-sm text-gray-800 font-heading font-extrabold uppercase tracking-wider">Receivings Log</h3>
      <span id="recordCount" class="text-xs font-bold bg-gray-200 text-gray-600 px-2.5 py-1 rounded-full">0</span>
    </div>

    <div id="receivingsList" class="space-y-4">
      <div class="text-center py-10"><i class="fa fa-circle-notch spinner text-gray-300 text-3xl"></i></div>
    </div>

  </main>

  <button onclick="openAddModal()" class="fab fixed bottom-8 right-6 lg:right-[calc(50%-180px)] w-16 h-16 bg-rose-500 text-white rounded-full flex items-center justify-center z-40 border-4 border-white shadow-2xl">
    <i class="fa fa-plus text-2xl"></i>
  </button>
</div>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center px-6 bg-gradient-to-br from-rose-600 via-rose-500 to-pink-500 app-container">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-24 h-24 bg-white/20 rounded-[2rem] flex items-center justify-center mx-auto mb-5 text-5xl shadow-lg border border-white/30">🌶</div>
      <h1 class="text-4xl font-heading font-extrabold text-white tracking-tight">Khuram Foods</h1>
      <p class="text-rose-100 text-sm mt-2 font-bold tracking-widest uppercase">Daily Receivings</p>
    </div>
    <div class="bg-white rounded-[2rem] p-7 shadow-2xl">
      <h2 class="font-heading font-bold text-gray-800 text-xl mb-6 text-center">Secure Sign In</h2>
      <div class="space-y-4">
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-2 ml-1">Username</label>
          <div class="relative">
            <i class="fa fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="loginUser" placeholder="Enter username" class="w-full border-2 border-gray-100 rounded-xl py-3.5 pl-11 pr-4 text-sm bg-gray-50 font-bold text-gray-800" onkeydown="if(event.key==='Enter')doLogin()" />
          </div>
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-2 ml-1">Password</label>
          <div class="relative">
            <i class="fa fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="password" id="loginPass" placeholder="Enter password" class="w-full border-2 border-gray-100 rounded-xl py-3.5 pl-11 pr-4 text-sm bg-gray-50 font-bold text-gray-800" onkeydown="if(event.key==='Enter')doLogin()" />
          </div>
        </div>
        <div id="loginError" class="hidden text-rose-500 text-xs text-center font-bold bg-rose-50 rounded-lg py-2.5 border border-rose-100"></div>
        <button onclick="doLogin()" id="loginBtn" class="w-full bg-rose-500 text-white py-4 rounded-xl font-heading font-bold text-sm mt-2 shadow-md active:bg-rose-600 transition-all flex justify-center items-center gap-2">
          <i class="fa fa-sign-in-alt"></i> Access Portal
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-full text-white text-sm font-bold shadow-2xl flex items-center gap-2.5 whitespace-nowrap border border-white/20"></div>

<div id="modalBackdrop" class="modal-backdrop fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center sm:items-center transition-all">
  <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-3xl p-6 pb-8 shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
    <div class="flex justify-between items-center mb-5 border-b border-gray-100 pb-4">
      <h3 class="font-heading font-bold text-xl text-gray-800" id="modalTitle">Modal</h3>
      <button onclick="closeModal()" class="w-8 h-8 bg-gray-100 rounded-full text-gray-500 flex items-center justify-center active:bg-gray-200 transition-colors"><i class="fa fa-times"></i></button>
    </div>
    <div id="modalBody"></div>
    <div class="flex gap-3 mt-6 pt-3 border-t border-gray-100">
      <button onclick="closeModal()" class="flex-1 py-3.5 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-600 active:bg-gray-50 transition-colors">Cancel</button>
      <button id="modalConfirmBtn" class="flex-1 py-3.5 bg-green-600 text-white rounded-xl text-sm font-bold active:bg-green-700 shadow-md transition-colors">Save Details</button>
    </div>
  </div>
</div>

<div id="confirmBackdrop" class="modal-backdrop fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center px-6 transition-all">
  <div class="bg-white w-full max-w-xs rounded-[2rem] p-6 shadow-2xl">
    <div class="w-16 h-16 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-rose-100">
      <i class="fa fa-trash-alt text-rose-500 text-2xl"></i>
    </div>
    <h3 class="font-heading font-bold text-xl text-center text-gray-800 mb-2">Delete Entry?</h3>
    <p class="text-gray-500 text-sm text-center mb-6 font-medium">This action cannot be undone. Record will be permanently removed.</p>
    <div class="flex gap-3">
      <button onclick="closeConfirm()" class="flex-1 py-3 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-600 active:bg-gray-50">Cancel</button>
      <button id="confirmYesBtn" class="flex-1 py-3 bg-rose-500 text-white rounded-xl text-sm font-bold shadow-md active:bg-rose-600">Yes, Delete</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SUPABASE_URL = 'https://ptwgiadzpzawjftfxwwf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Qoy-USZ2VP94_n5x1BcjWQ_HV5deVBB';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let confirmCallback = null;

// ── INIT ─────────────────────────────────────────────────────
window.onload = () => {
  if (sessionStorage.getItem('kf_user')) showApp();
  else showLogin();
};

// ── AUTH ─────────────────────────────────────────────────────
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const btn = document.getElementById('loginBtn');
  
  if (!u || !p) { showLoginErr('Please enter username and password.'); return; }

  btn.innerHTML = '<i class="fa fa-circle-notch spinner"></i> Signing in...';
  btn.disabled = true;

  const { data, error } = await sb.from('khuram_users').select('*').eq('username', u).eq('password', p).single();

  btn.innerHTML = '<i class="fa fa-sign-in-alt"></i> Access Portal';
  btn.disabled = false;

  if (error || !data) { showLoginErr('Invalid username or password.'); return; }

  sessionStorage.setItem('kf_user', JSON.stringify(data));
  showApp();
}

function showLoginErr(msg) {
  const err = document.getElementById('loginError');
  err.textContent = msg;
  err.classList.remove('hidden');
}

function logout() {
  sessionStorage.removeItem('kf_user');
  window.location.reload(); 
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.removeProperty('display');
  
  // Set default dates to TODAY
  const todayDate = new Date().toISOString().split('T')[0];
  document.getElementById('dashStartDate').value = todayDate;
  document.getElementById('dashEndDate').value = todayDate;
  
  loadDashboard();
}

function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-PK', { day: '2-digit', month: 'short', year: 'numeric' }) : '-'; }
function fmtPKR(n) { return n != null ? 'Rs ' + Number(n).toLocaleString('en-PK') : '–'; }
function escHtml(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

// ── DASHBOARD (FETCH DATA) ───────────────────────────────────
async function loadDashboard() {
  const start = document.getElementById('dashStartDate').value;
  const end = document.getElementById('dashEndDate').value;

  // Update date text on card
  if(start === end) {
      document.getElementById('dashDateRangeText').textContent = fmtDate(start);
  } else {
      document.getElementById('dashDateRangeText').textContent = `${fmtDate(start)} to ${fmtDate(end)}`;
  }

  document.getElementById('dashTotal').innerHTML = '<i class="fa fa-circle-notch spinner text-3xl opacity-80"></i>';
  const container = document.getElementById('receivingsList');
  container.innerHTML = '<div class="text-center py-10"><i class="fa fa-circle-notch spinner text-gray-300 text-3xl"></i></div>';

  const { data, error } = await sb.from('khuram_receivings')
    .select('*')
    .gte('date', start)
    .lte('date', end)
    .order('date', { ascending: false })
    .order('id', { ascending: false });
    
  if (error) { toast('Error loading data', 'error'); return; }

  // Calculate Total
  const total = data.reduce((sum, row) => sum + Number(row.amount), 0);
  document.getElementById('dashTotal').textContent = fmtPKR(total);
  document.getElementById('recordCount').textContent = `${data.length} Records`;

  if (!data.length) {
    container.innerHTML = `
      <div class="bg-white rounded-3xl p-10 text-center border-2 border-dashed border-gray-200 mt-4">
        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa fa-inbox text-gray-300 text-4xl"></i>
        </div>
        <p class="text-gray-500 font-bold">No receivings found</p>
        <p class="text-xs text-gray-400 mt-1 font-medium">Try changing the date range</p>
      </div>`;
    return;
  }

  // Render List
  container.innerHTML = data.map(r => `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative group">
      <div class="p-4 sm:p-5">
        <div class="flex justify-between items-start mb-3">
          <div class="flex-1 min-w-0 pr-4">
            <p class="text-sm sm:text-base font-heading font-extrabold text-gray-800 uppercase tracking-wide truncate">${escHtml(r.account_name)}</p>
            <p class="text-[10px] sm:text-xs font-bold text-gray-400 mt-1 uppercase"><i class="fa fa-calendar-day mr-1"></i>${fmtDate(r.date)}</p>
          </div>
          <div class="text-right flex-shrink-0">
            <p class="text-lg sm:text-xl font-black text-green-600 bg-green-50 px-3 py-1 rounded-xl border border-green-100">${fmtPKR(r.amount)}</p>
          </div>
        </div>
        <div class="bg-gray-50 rounded-xl p-3 sm:p-4 border border-gray-200/60 mt-2">
          <p class="text-[12px] sm:text-sm text-gray-700 font-bold leading-relaxed whitespace-pre-line break-words">${escHtml(r.particulars)}</p>
        </div>
      </div>
      <div class="flex bg-gray-50 border-t border-gray-100 divide-x divide-gray-200">
        <button onclick="openEditModal(${r.id})" class="flex-1 py-3 text-[11px] sm:text-xs text-blue-600 font-bold flex items-center justify-center gap-2 hover:bg-blue-50 transition-colors"><i class="fa fa-pen"></i> EDIT</button>
        <button onclick="deleteReceiving(${r.id})" class="flex-1 py-3 text-[11px] sm:text-xs text-rose-500 font-bold flex items-center justify-center gap-2 hover:bg-rose-50 transition-colors"><i class="fa fa-trash"></i> DELETE</button>
      </div>
    </div>
  `).join('');
}

// ── ADD MODAL ────────────────────────────────────────────────
function openAddModal() {
  const todayStr = new Date().toISOString().split('T')[0];
  
  showModal('Add New Receiving', `
    <div class="space-y-4">
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Receiving Date</label>
        <input type="date" id="mDate" value="${todayStr}" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-bold text-gray-800" />
      </div>
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Account Name</label>
        <input type="text" id="mAccount" placeholder="e.g. SOHAIL AHMAD KANA" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-bold text-gray-800 uppercase" />
      </div>
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Amount Received (Rs)</label>
        <input type="number" id="mAmount" placeholder="0" class="w-full border-2 border-green-200 rounded-xl py-3.5 px-4 text-xl bg-green-50 font-black text-green-700 shadow-inner" />
      </div>
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Particulars / Remarks</label>
        <textarea id="mParticulars" rows="3" placeholder="e.g. SOHAIL TRADERS SENT ONLINE TO AZAM RICE TRADERS" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-bold leading-relaxed text-gray-700 uppercase"></textarea>
      </div>
    </div>
  `, async () => {
    const date = document.getElementById('mDate').value;
    const account_name = document.getElementById('mAccount').value.trim().toUpperCase();
    const amount = parseFloat(document.getElementById('mAmount').value);
    const particulars = document.getElementById('mParticulars').value.trim().toUpperCase();

    if (!date || !account_name || !particulars || isNaN(amount) || amount <= 0) { 
        toast('Please fill all fields correctly.', 'error'); 
        return; 
    }

    const entry = { date, account_name, particulars, amount };
    const { error } = await sb.from('khuram_receivings').insert(entry);
    
    if (error) { toast('Error saving data', 'error'); return; }

    closeModal();
    toast('Receiving Added!', 'success');
    loadDashboard();
  });
}

// ── EDIT MODAL ───────────────────────────────────────────────
async function openEditModal(id) {
  const { data, error } = await sb.from('khuram_receivings').select('*').eq('id', id).single();
  if (error || !data) { toast('Error fetching record', 'error'); return; }

  showModal('Edit Receiving', `
    <div class="space-y-4">
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Receiving Date</label>
        <input type="date" id="mDate" value="${data.date}" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-bold text-gray-800" />
      </div>
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Account Name</label>
        <input type="text" id="mAccount" value="${escHtml(data.account_name)}" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-bold text-gray-800 uppercase" />
      </div>
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Amount Received (Rs)</label>
        <input type="number" id="mAmount" value="${data.amount}" class="w-full border-2 border-green-200 rounded-xl py-3.5 px-4 text-xl bg-green-50 font-black text-green-700 shadow-inner" />
      </div>
      <div>
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 ml-1">Particulars / Remarks</label>
        <textarea id="mParticulars" rows="3" class="w-full border-2 border-gray-200 rounded-xl py-3 px-3 text-sm bg-gray-50 font-bold leading-relaxed text-gray-700 uppercase">${escHtml(data.particulars)}</textarea>
      </div>
    </div>
  `, async () => {
    const date = document.getElementById('mDate').value;
    const account_name = document.getElementById('mAccount').value.trim().toUpperCase();
    const amount = parseFloat(document.getElementById('mAmount').value);
    const particulars = document.getElementById('mParticulars').value.trim().toUpperCase();

    if (!date || !account_name || !particulars || isNaN(amount) || amount <= 0) { 
        toast('Please fill all fields correctly.', 'error'); 
        return; 
    }

    const { error } = await sb.from('khuram_receivings').update({ date, account_name, particulars, amount }).eq('id', id);
    
    if (error) { toast('Error updating data', 'error'); return; }

    closeModal();
    toast('Receiving Updated!', 'success');
    loadDashboard();
  });
}

// ── DELETE ───────────────────────────────────────────────────
function deleteReceiving(id) {
  showConfirm(async () => {
    const { error } = await sb.from('khuram_receivings').delete().eq('id', id);
    if (error) { toast('Error deleting record', 'error'); return; }
    toast('Record Deleted!', 'success');
    loadDashboard();
  });
}

// ── MODALS / UTILS ────────────────────────────────────────────
function showModal(title, body, onConfirm) {
  document.getElementById('modalTitle').textContent = title; 
  document.getElementById('modalBody').innerHTML = body; 
  document.getElementById('modalConfirmBtn').onclick = onConfirm;
  document.getElementById('modalBackdrop').classList.remove('hidden'); 
  document.getElementById('modalBackdrop').classList.add('flex');
}

function closeModal() { 
  document.getElementById('modalBackdrop').classList.add('hidden'); 
  document.getElementById('modalBackdrop').classList.remove('flex'); 
}

document.getElementById('modalBackdrop').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

function showConfirm(cb) { 
  confirmCallback = cb; 
  document.getElementById('confirmBackdrop').classList.remove('hidden'); 
  document.getElementById('confirmBackdrop').classList.add('flex'); 
  document.getElementById('confirmYesBtn').onclick = async () => { 
      closeConfirm(); 
      if (confirmCallback) await confirmCallback(); 
      confirmCallback = null; 
  }; 
}

function closeConfirm() { 
  document.getElementById('confirmBackdrop').classList.add('hidden'); 
  document.getElementById('confirmBackdrop').classList.remove('flex'); 
}

document.getElementById('confirmBackdrop').addEventListener('click', function(e) { if (e.target === this) closeConfirm(); });

let toastTimer;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = `fixed bottom-10 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-full text-white text-sm font-bold shadow-2xl flex items-center gap-2.5 whitespace-nowrap border border-white/20 ${type === 'success' ? 'bg-gray-800' : 'bg-rose-600'}`;
  el.innerHTML = `<i class="fa ${type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-white'} text-lg"></i> ${msg}`;
  el.classList.add('show'); 
  clearTimeout(toastTimer); 
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
