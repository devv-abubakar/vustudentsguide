<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khuram Foods - Cash Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'DM Sans', sans-serif; background: #f3f4f6; overscroll-behavior: none; }
    h1,h2,h3,.font-heading { font-family: 'Sora', sans-serif; }

    /* Toast & Modals */
    #toast { transition: all 0.3s ease; transform: translateY(100px); opacity: 0; }
    #toast.show { transform: translateY(0); opacity: 1; }
    .modal-backdrop { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* Floating Action Button */
    .fab { box-shadow: 0 8px 30px rgba(0,0,0,0.25); transition: transform 0.2s ease; }
    .fab:active { transform: scale(0.92); }

    /* Input Focus */
    input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); border-color: #94a3b8; }

    /* Card Backgrounds */
    .stat-card-receive { background: linear-gradient(135deg, #10b981 0%, #059669 100%); position: relative; overflow: hidden; }
    .stat-card-receive::after { content: '\f0d6'; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; right: -15px; bottom: -20px; font-size: 100px; color: rgba(255,255,255,0.1); transform: rotate(-15deg); }
    
    .stat-card-sent { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); position: relative; overflow: hidden; }
    .stat-card-sent::after { content: '\f53a'; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; right: -15px; bottom: -20px; font-size: 100px; color: rgba(255,255,255,0.1); transform: rotate(-15deg); }

    .stat-card-receivable { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); position: relative; overflow: hidden; }
    .stat-card-receivable::after { content: '\f0c0'; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; right: -15px; bottom: -20px; font-size: 100px; color: rgba(255,255,255,0.1); transform: rotate(-15deg); }

    /* Bottom Navigation Active States */
    .nav-btn .nav-icon { color: #9ca3af; transition: all 0.2s ease; }
    .nav-btn .nav-label { color: #9ca3af; transition: all 0.2s ease; }

    .nav-btn.active-receive .nav-icon { color: #10b981; transform: translateY(-3px); }
    .nav-btn.active-receive .nav-label { color: #10b981; font-weight: 800; }
    
    .nav-btn.active-sent .nav-icon { color: #f43f5e; transform: translateY(-3px); }
    .nav-btn.active-sent .nav-label { color: #f43f5e; font-weight: 800; }

    .nav-btn.active-receivable .nav-icon { color: #3b82f6; transform: translateY(-3px); }
    .nav-btn.active-receivable .nav-label { color: #3b82f6; font-weight: 800; }

    /* Spinner */
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile Constraints */
    @media (min-width: 480px) {
      .app-container { max-width: 420px; margin: 0 auto; background: #fff; box-shadow: 0 0 30px rgba(0,0,0,0.08); min-height: 100vh; position: relative; }
      body { background: #e2e8f0; }
      .bottom-nav-wrapper { max-width: 420px; left: 50% !important; transform: translateX(-50%); border-left: 1px solid #eee; border-right: 1px solid #eee; }
    }
  </style>
</head>
<body>

<div class="app-container flex flex-col min-h-screen" id="app" style="display:none!important">

  <header class="bg-gray-900 text-white px-5 py-4 flex items-center justify-between z-30 sticky top-0 shadow-md">
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-sm">
        <span class="text-xl">🌶</span>
      </div>
      <div class="flex flex-col">
        <span class="text-xl font-heading font-extrabold tracking-tight leading-none">Khuram Foods</span>
        <span id="networkStatus" class="text-[10px] font-bold text-green-400 mt-1 uppercase tracking-widest"><i class="fa fa-wifi mr-1"></i> Online</span>
      </div>
    </div>
    <button onclick="logout()" class="flex items-center gap-1.5 text-sm bg-white/10 hover:bg-white/20 px-3 py-2 rounded-lg font-bold transition-colors">
      <i class="fa fa-sign-out-alt text-sm"></i>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto px-4 pt-5 pb-32 bg-gray-50/50">

    <div id="dashFilters" class="bg-white rounded-[1.25rem] p-4 shadow-sm border border-gray-100 mb-5">
      <div class="flex gap-4">
        <div class="flex-1">
          <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1.5 block ml-1">Start Date</label>
          <input type="date" id="dashStartDate" class="w-full border-2 border-gray-100 rounded-xl bg-gray-50 text-xs py-2.5 px-2 font-bold text-gray-800 shadow-inner" onchange="loadData()" />
        </div>
        <div class="flex-1">
          <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1.5 block ml-1">End Date</label>
          <input type="date" id="dashEndDate" class="w-full border-2 border-gray-100 rounded-xl bg-gray-50 text-xs py-2.5 px-2 font-bold text-gray-800 shadow-inner" onchange="loadData()" />
        </div>
      </div>
    </div>

    <div id="receivableSearchContainer" class="hidden bg-white rounded-[1.25rem] p-4 shadow-sm border border-gray-100 mb-5">
      <div class="relative">
        <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="receivableSearchInput" placeholder="Search account name..." class="w-full border-2 border-gray-100 rounded-xl py-2.5 pl-11 pr-4 text-sm font-bold text-gray-800 shadow-inner" oninput="renderReceivableList()" />
      </div>
    </div>

    <div id="dashCard" class="stat-card-receive text-white rounded-[1.5rem] p-6 shadow-lg mb-6">
      <p class="text-[12px] font-bold opacity-90 mb-1 uppercase tracking-widest flex items-center gap-2" id="dashTitle">
        <i class="fa fa-arrow-down"></i> Total Received Amount
      </p>
      <p class="text-4xl font-heading font-black tracking-tight" id="dashTotal">...</p>
      <p class="text-[11px] opacity-75 mt-2 font-medium" id="dashDateRangeText">Loading dates...</p>
    </div>

    <div class="flex justify-between items-center mb-4 px-1">
      <h3 class="text-sm text-gray-800 font-heading font-extrabold uppercase tracking-wider" id="listTitle">Receivings Log</h3>
      <span id="recordCount" class="text-xs font-bold bg-gray-200 text-gray-600 px-2.5 py-1 rounded-full">0</span>
    </div>

    <div id="dataList" class="space-y-4">
      <div class="text-center py-10"><i class="fa fa-circle-notch spinner text-gray-300 text-3xl"></i></div>
    </div>

  </main>

  <button id="addBtn" onclick="openAddModal()" class="fab fixed bottom-24 right-6 lg:right-[calc(50%-180px)] w-16 h-16 bg-green-500 text-white rounded-full flex items-center justify-center z-40 border-4 border-white shadow-2xl">
    <i class="fa fa-plus text-2xl"></i>
  </button>

  <nav class="bottom-nav-wrapper fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30 shadow-[0_-4px_24px_rgba(0,0,0,0.08)] pb-safe">
    <div class="flex">
      <button id="nav-receive" class="nav-btn active-receive flex-1 flex flex-col items-center py-3.5 gap-1.5 transition-all" onclick="switchTab('receive')">
        <i class="nav-icon fa fa-hand-holding-dollar text-[22px] transition-all"></i>
        <span class="nav-label text-[10px] uppercase tracking-widest font-semibold">Receive</span>
      </button>
      
      <div class="w-px bg-gray-100 my-2"></div>

      <button id="nav-sent" class="nav-btn flex-1 flex flex-col items-center py-3.5 gap-1.5 transition-all" onclick="switchTab('sent')">
        <i class="nav-icon fa fa-paper-plane text-[22px] transition-all"></i>
        <span class="nav-label text-[10px] uppercase tracking-widest font-semibold">Sent</span>
      </button>

      <div id="divider-receivable" class="w-px bg-gray-100 my-2 hidden"></div>

      <button id="nav-receivable" class="nav-btn hidden flex-1 flex flex-col items-center py-3.5 gap-1.5 transition-all" onclick="switchTab('receivable')">
        <i class="nav-icon fa fa-users text-[22px] transition-all"></i>
        <span class="nav-label text-[10px] uppercase tracking-widest font-semibold">Receivable</span>
      </button>

    </div>
  </nav>
</div>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center px-6 bg-gray-900 app-container">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-24 h-24 bg-white/10 rounded-[2rem] flex items-center justify-center mx-auto mb-5 text-5xl shadow-lg border border-white/10">🌶</div>
      <h1 class="text-4xl font-heading font-extrabold text-white tracking-tight">Khuram Foods</h1>
      <p class="text-gray-400 text-sm mt-2 font-bold tracking-widest uppercase">Cash Flow System</p>
    </div>
    <div class="bg-white rounded-[2rem] p-7 shadow-2xl">
      <h2 class="font-heading font-bold text-gray-800 text-xl mb-6 text-center">Secure Sign In</h2>
      <div class="space-y-4">
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-2 ml-1">Username</label>
          <div class="relative">
            <i class="fa fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="loginUser" placeholder="Enter username" class="w-full border-2 border-gray-100 rounded-xl py-3.5 pl-11 pr-4 text-sm bg-gray-50 font-bold text-gray-800" onkeydown="if(event.key==='Enter')doLogin()" />
          </div>
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block mb-2 ml-1">Password</label>
          <div class="relative">
            <i class="fa fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="password" id="loginPass" placeholder="Enter password" class="w-full border-2 border-gray-100 rounded-xl py-3.5 pl-11 pr-4 text-sm bg-gray-50 font-bold text-gray-800" onkeydown="if(event.key==='Enter')doLogin()" />
          </div>
        </div>
        <div id="loginError" class="hidden text-rose-500 text-xs text-center font-bold bg-rose-50 rounded-lg py-2.5 border border-rose-100"></div>
        <button onclick="doLogin()" id="loginBtn" class="w-full bg-gray-800 hover:bg-gray-900 text-white py-4 rounded-xl font-heading font-bold text-sm mt-2 shadow-md transition-all flex justify-center items-center gap-2">
          <i class="fa fa-sign-in-alt"></i> Access Portal
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-[110px] left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-full text-white text-sm font-bold shadow-2xl flex items-center gap-2.5 whitespace-nowrap border border-white/20"></div>

<div id="securityBackdrop" class="modal-backdrop fixed inset-0 bg-black/70 z-[60] hidden flex items-center justify-center px-6 transition-all">
  <div class="bg-white w-full max-w-xs rounded-[2rem] p-6 shadow-2xl">
    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm">
      <i class="fa fa-lock text-gray-600 text-2xl"></i>
    </div>
    <h3 class="font-heading font-bold text-xl text-center text-gray-800 mb-2">Security Check</h3>
    <p class="text-gray-500 text-[11px] text-center mb-5 font-bold uppercase tracking-wide">Enter PIN to proceed</p>
    
    <input type="password" id="authPin" inputmode="numeric" pattern="[0-9]*" placeholder="***" class="w-full text-center border-2 border-gray-200 rounded-xl py-3 text-2xl bg-gray-50 font-black tracking-widest text-gray-800 mb-5 focus:border-gray-800" onkeydown="if(event.key==='Enter')verifyPassword()" />
    
    <div class="flex gap-3">
      <button onclick="closeSecurityModal()" class="flex-1 py-3 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-600 active:bg-gray-50">Cancel</button>
      <button onclick="verifyPassword()" class="flex-1 py-3 bg-gray-800 text-white rounded-xl text-sm font-bold shadow-md active:bg-gray-900">Verify</button>
    </div>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center sm:items-center transition-all">
  <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-3xl p-6 pb-8 shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
    <div class="flex justify-between items-center mb-5 border-b border-gray-100 pb-4">
      <h3 class="font-heading font-bold text-xl text-gray-800" id="modalTitle">Modal</h3>
      <button onclick="closeModal()" class="w-8 h-8 bg-gray-100 rounded-full text-gray-500 flex items-center justify-center active:bg-gray-200 transition-colors"><i class="fa fa-times"></i></button>
    </div>
    <div id="modalBody"></div>
    <div class="flex gap-3 mt-6 pt-3 border-t border-gray-100">
      <button onclick="closeModal()" class="flex-1 py-3.5 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-600 active:bg-gray-50 transition-colors">Cancel</button>
      <button id="modalConfirmBtn" class="flex-1 py-3.5 text-white rounded-xl text-sm font-bold shadow-md transition-colors">Save Details</button>
    </div>
  </div>
</div>

<div id="confirmBackdrop" class="modal-backdrop fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center px-6 transition-all">
  <div class="bg-white w-full max-w-xs rounded-[2rem] p-6 shadow-2xl">
    <div class="w-16 h-16 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-rose-100">
      <i class="fa fa-trash-alt text-rose-500 text-2xl"></i>
    </div>
    <h3 class="font-heading font-bold text-xl text-center text-gray-800 mb-2">Delete Entry?</h3>
    <p class="text-gray-500 text-sm text-center mb-6 font-medium">This action cannot be undone. Record will be permanently removed.</p>
    <div class="flex gap-3">
      <button onclick="closeConfirm()" class="flex-1 py-3 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-600 active:bg-gray-50">Cancel</button>
      <button id="confirmYesBtn" class="flex-1 py-3 bg-rose-500 text-white rounded-xl text-sm font-bold shadow-md active:bg-rose-600">Yes, Delete</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SUPABASE_URL = 'https://ptwgiadzpzawjftfxwwf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Qoy-USZ2VP94_n5x1BcjWQ_HV5deVBB';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTab = 'receive'; 
let authPendingAction = null; 
let confirmCallback = null;
let loggedInUser = null;
let receivableData = []; // Store fetched receivable data globally for searching

// ── INIT & OFFLINE SYNC ──────────────────────────────────────
window.onload = () => {
  updateNetworkStatus();
  window.addEventListener('online', () => { updateNetworkStatus(); syncOfflineRecords(); });
  window.addEventListener('offline', updateNetworkStatus);

  const userStr = sessionStorage.getItem('kf_user');
  if (userStr) {
      loggedInUser = JSON.parse(userStr);
      showApp();
      syncOfflineRecords(); 
  }
  else { showLogin(); }
};

function updateNetworkStatus() {
  const statusEl = document.getElementById('networkStatus');
  if (navigator.onLine) {
      statusEl.innerHTML = '<i class="fa fa-wifi mr-1"></i> Online';
      statusEl.className = 'text-[10px] font-bold text-green-400 mt-1 uppercase tracking-widest';
  } else {
      statusEl.innerHTML = '<i class="fa fa-wifi-slash mr-1"></i> Offline';
      statusEl.className = 'text-[10px] font-bold text-orange-400 mt-1 uppercase tracking-widest';
  }
}

// ── AUTH ─────────────────────────────────────────────────────
async function doLogin() {
  if (!navigator.onLine) { showLoginErr('Internet required to login.'); return; }

  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const btn = document.getElementById('loginBtn');
  
  if (!u || !p) { showLoginErr('Please enter username and password.'); return; }

  btn.innerHTML = '<i class="fa fa-circle-notch spinner"></i> Checking...';
  btn.disabled = true;

  const { data, error } = await sb.from('khuram_users').select('*').eq('username', u).eq('password', p).single();

  btn.innerHTML = '<i class="fa fa-sign-in-alt"></i> Access Portal';
  btn.disabled = false;

  if (error || !data) { showLoginErr('Invalid username or password.'); return; }

  loggedInUser = data;
  sessionStorage.setItem('kf_user', JSON.stringify(data));
  showApp();
}

function showLoginErr(msg) {
  const err = document.getElementById('loginError');
  err.textContent = msg;
  err.classList.remove('hidden');
}

function logout() {
  sessionStorage.removeItem('kf_user');
  window.location.reload(); 
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.removeProperty('display');
  
  if (loggedInUser && loggedInUser.username === 'admin') {
      document.getElementById('nav-receivable').classList.remove('hidden');
      document.getElementById('divider-receivable').classList.remove('hidden');
  } else {
      document.getElementById('nav-receivable').classList.add('hidden');
      document.getElementById('divider-receivable').classList.add('hidden');
  }

  const todayDate = new Date().toISOString().split('T')[0];
  document.getElementById('dashStartDate').value = todayDate;
  document.getElementById('dashEndDate').value = todayDate;
  
  switchTab('receive'); 
}

// ── TAB LOGIC ────────────────────────────────────────────────
function switchTab(tabName) {
  currentTab = tabName;
  
  const btnRec = document.getElementById('nav-receive');
  const btnSent = document.getElementById('nav-sent');
  const btnReceivable = document.getElementById('nav-receivable');
  const dashCard = document.getElementById('dashCard');
  const addBtn = document.getElementById('addBtn');
  const dashFilters = document.getElementById('dashFilters');
  const recSearch = document.getElementById('receivableSearchContainer');

  btnRec.classList.remove('active-receive');
  btnSent.classList.remove('active-sent');
  if(btnReceivable) btnReceivable.classList.remove('active-receivable');

  if (tabName === 'receive') {
      btnRec.classList.add('active-receive');
      dashFilters.classList.remove('hidden');
      recSearch.classList.add('hidden');
      
      dashCard.className = 'stat-card-receive text-white rounded-[1.5rem] p-6 shadow-lg mb-6';
      document.getElementById('dashTitle').innerHTML = '<i class="fa fa-arrow-down"></i> Total Received Amount';
      document.getElementById('listTitle').textContent = 'Receivings Log';
      addBtn.className = 'fab fixed bottom-24 right-6 lg:right-[calc(50%-180px)] w-16 h-16 bg-green-500 text-white rounded-full flex items-center justify-center z-40 border-4 border-white shadow-2xl';
  } else if (tabName === 'sent') {
      btnSent.classList.add('active-sent');
      dashFilters.classList.remove('hidden');
      recSearch.classList.add('hidden');
      
      dashCard.className = 'stat-card-sent text-white rounded-[1.5rem] p-6 shadow-lg mb-6';
      document.getElementById('dashTitle').innerHTML = '<i class="fa fa-arrow-up"></i> Total Sent Amount';
      document.getElementById('listTitle').textContent = 'Sent Payments Log';
      addBtn.className = 'fab fixed bottom-24 right-6 lg:right-[calc(50%-180px)] w-16 h-16 bg-rose-500 text-white rounded-full flex items-center justify-center z-40 border-4 border-white shadow-2xl';
  } else if (tabName === 'receivable') {
      btnReceivable.classList.add('active-receivable');
      dashFilters.classList.add('hidden'); 
      recSearch.classList.remove('hidden'); 
      document.getElementById('receivableSearchInput').value = '';
      
      dashCard.className = 'stat-card-receivable text-white rounded-[1.5rem] p-6 shadow-lg mb-6';
      document.getElementById('dashTitle').innerHTML = '<i class="fa fa-users"></i> Total Receivable Balance';
      document.getElementById('listTitle').textContent = 'Accounts Summary';
      addBtn.className = 'fab fixed bottom-24 right-6 lg:right-[calc(50%-180px)] w-16 h-16 bg-blue-500 text-white rounded-full flex items-center justify-center z-40 border-4 border-white shadow-2xl';
  }

  loadData();
}

function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-PK', { day: '2-digit', month: 'short', year: 'numeric' }) : '-'; }
function fmtPKR(n) { return n != null ? 'Rs ' + Number(n).toLocaleString('en-PK') : '–'; }
function escHtml(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── FETCH & RENDER DATA ──────────────────────────────────────
async function loadData() {
  document.getElementById('dashTotal').innerHTML = '<i class="fa fa-circle-notch spinner text-3xl opacity-80"></i>';
  const container = document.getElementById('dataList');
  container.innerHTML = '<div class="text-center py-10"><i class="fa fa-circle-notch spinner text-gray-300 text-3xl"></i></div>';

  if (currentTab === 'receivable') {
      receivableData = []; // Clear array
      if (navigator.onLine) {
          const { data, error } = await sb.from('khuram_receivable').select('*').order('account_name', { ascending: true });
          if (!error && data) receivableData = data;
      } else {
          toast('Offline: Showing cached/empty list', 'error');
      }
      
      renderReceivableList(); // Call the render function to display data

  } else {
      // ── LOGIC FOR RECEIVE & SENT TABS (With Offline Merge) ──
      const start = document.getElementById('dashStartDate').value;
      const end = document.getElementById('dashEndDate').value;

      if(start === end) { document.getElementById('dashDateRangeText').textContent = fmtDate(start); } 
      else { document.getElementById('dashDateRangeText').textContent = `${fmtDate(start)} to ${fmtDate(end)}`; }

      const targetTable = currentTab === 'receive' ? 'khuram_receivings' : 'khuram_sent';
      
      let dbData = [];
      if (navigator.onLine) {
          const { data, error } = await sb.from(targetTable)
            .select('*')
            .gte('date', start)
            .lte('date', end);
          if (!error && data) dbData = data;
      }

      const queueKey = currentTab === 'receive' ? 'offline_receivings' : 'offline_sent';
      let localQueue = JSON.parse(localStorage.getItem(queueKey) || '[]');
      
      localQueue = localQueue.filter(r => r.date >= start && r.date <= end);
      
      let combinedData = [...localQueue.map(item => ({...item, isOffline: true})), ...dbData];

// ── OFFLINE SYNC LOGIC ───────────────────────────────────────
function saveOfflineRecord(table, record) {
  const queueKey = table === 'khuram_receivings' ? 'offline_receivings' : 'offline_sent';
  let queue = JSON.parse(localStorage.getItem(queueKey) || '[]');
  queue.push(record);
  localStorage.setItem(queueKey, JSON.stringify(queue));
  toast('Saved Offline! Will sync automatically.', 'success');
  loadData();
}

async function syncOfflineRecords() {
  if (!navigator.onLine) return;
  
  let recQueue = JSON.parse(localStorage.getItem('offline_receivings') || '[]');
  let sentQueue = JSON.parse(localStorage.getItem('offline_sent') || '[]');
  let hasSynced = false;

  if (recQueue.length > 0) {
      const { error } = await sb.from('khuram_receivings').insert(recQueue);
      if (!error) {
          localStorage.removeItem('offline_receivings');
          hasSynced = true;
      }
  }

  if (sentQueue.length > 0) {
      const { error } = await sb.from('khuram_sent').insert(sentQueue);
      if (!error) {
          localStorage.removeItem('offline_sent');
          hasSynced = true;
      }
  }

  if (hasSynced) {
      toast('Offline records Synced to Database!', 'success');
      loadData();
  }
}

// ── SECURITY PIN MODAL (114) ─────────────────────────────────
function requestPassword(actionCallback) {
  authPendingAction = actionCallback;
  document.getElementById('authPin').value = '';
  document.getElementById('securityBackdrop').classList.remove('hidden');
  document.getElementById('securityBackdrop').classList.add('flex');
  setTimeout(() => document.getElementById('authPin').focus(), 100);
}

function closeSecurityModal() {
  document.getElementById('securityBackdrop').classList.add('hidden');
  document.getElementById('securityBackdrop').classList.remove('flex');
  authPendingAction = null;
}

function verifyPassword() {
  const pin = document.getElementById('authPin').value;
  if(pin === '114') {
      closeSecurityModal();
      if(authPendingAction) authPendingAction(); 
  } else {
      toast('Incorrect Security PIN!', 'error');
  }
}

// ── MODALS / UTILS ────────────────────────────────────────────
function showModal(title, body, onConfirm) {
  document.getElementById('modalTitle').textContent = title; 
  document.getElementById('modalBody').innerHTML = body; 
  document.getElementById('modalConfirmBtn').onclick = onConfirm;
  document.getElementById('modalBackdrop').classList.remove('hidden'); 
  document.getElementById('modalBackdrop').classList.add('flex');
}

function closeModal() { 
  document.getElementById('modalBackdrop').classList.add('hidden'); 
  document.getElementById('modalBackdrop').classList.remove('flex'); 
}

function showConfirm(cb) { 
  confirmCallback = cb; 
  document.getElementById('confirmBackdrop').classList.remove('hidden'); 
  document.getElementById('confirmBackdrop').classList.add('flex'); 
  document.getElementById('confirmYesBtn').onclick = async () => { 
      closeConfirm(); 
      if (confirmCallback) await confirmCallback(); 
      confirmCallback = null; 
  }; 
}

function closeConfirm() { 
  document.getElementById('confirmBackdrop').classList.add('hidden'); 
  document.getElementById('confirmBackdrop').classList.remove('flex'); 
}

let toastTimer;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = `fixed bottom-[110px] left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-full text-white text-sm font-bold shadow-2xl flex items-center gap-2.5 whitespace-nowrap border border-white/20 ${type === 'success' ? 'bg-gray-800' : 'bg-rose-600'}`;
  el.innerHTML = `<i class="fa ${type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-white'} text-lg"></i> ${msg}`;
  el.classList.add('show'); 
  clearTimeout(toastTimer); 
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
