<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Bypass Link</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f4f4;
        }
        .link-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .bypass-btn { 
            display: block; 
            padding: 15px; 
            margin: 10px 0; 
            background-color: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="link-container">
        <h3>FRP Style Settings Links</h3>
        <p>In links par click karein. Yeh direct Android system ko target karte hain:</p>

        <a href="intent:#Intent;action=android.settings.SETTINGS;end" class="bypass-btn">
            ▶ Open Settings App (General)
        </a>
        
        <a href="intent://com.android.settings/#Intent;scheme=android-app;package=com.android.settings;end" class="bypass-btn">
            ▶ Open Settings App (Package Target)
        </a>

    </div>

</body>
</html>
