<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You, Roshni ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-light: #f9d976;
            --gold-dark: #e9b646;
            --bg-dark: #0a0510;
            --bg-glow: #231236;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            transition: background 2s ease;
        }

        /* Magical Glowing Background */
        .ambient-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, var(--bg-glow) 0%, var(--bg-dark) 80%);
            opacity: 0;
            transition: opacity 3s ease;
            z-index: 1;
        }

        /* Fireflies / Glowing Dust */
        #fireflies {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .firefly {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-light), 0 0 20px var(--gold-light);
            animation: floatFly var(--duration) infinite ease-in-out alternate;
            opacity: 0;
            transition: opacity 2s;
        }

        @keyframes floatFly {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0.3; }
            100% { transform: translate(var(--moveX), var(--moveY)) scale(1.2); opacity: 1; }
        }

        /* --- Intro Screen --- */
        #introScreen {
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease;
        }

        .tap-btn {
            background: transparent;
            border: 2px solid var(--gold-dark);
            color: var(--gold-light);
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-style: italic;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(233, 182, 70, 0.2), inset 0 0 10px rgba(233, 182, 70, 0.1);
            animation: pulseGlow 2s infinite alternate;
            transition: transform 0.3s;
        }

        .tap-btn:active {
            transform: scale(0.95);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(233, 182, 70, 0.2), inset 0 0 10px rgba(233, 182, 70, 0.1); }
            100% { box-shadow: 0 0 30px rgba(233, 182, 70, 0.6), inset 0 0 20px rgba(233, 182, 70, 0.4); text-shadow: 0 0 8px var(--gold-light); }
        }

        /* --- Main Story Card --- */
        #mainCard {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 380px;
            background: rgba(20, 10, 30, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(233, 182, 70, 0.3);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(233, 182, 70, 0.05);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: none;
        }

        /* Golden Gradient Text for Name */
        .gold-text {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Story Text */
        .story-content {
            font-size: 19px;
            line-height: 1.7;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0dced;
        }

        .text-fade {
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s ease;
        }

        .text-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Elegant Next Button */
        .next-icon {
            margin-top: 30px;
            font-size: 30px;
            color: var(--gold-light);
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            animation: floatArrow 2s infinite ease-in-out;
            display: inline-block;
        }

        .next-icon.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes floatArrow {
            0% { transform: translateY(0); }
            50% { transform: translateY(8px); }
            100% { transform: translateY(0); }
        }

        /* Romantic Floating Hearts at the end */
        .heart {
            position: absolute;
            color: var(--gold-light);
            font-size: 20px;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.5) rotate(-15deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(15deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="ambient-glow" id="ambientBg"></div>
    <div id="fireflies"></div>

    <div id="introScreen">
        <button class="tap-btn" onclick="startMagic()">Tap to open ✨</button>
    </div>

    <div id="mainCard">
        <div class="gold-text" id="heading">Roshni...</div>
        <div class="story-content">
            <div class="text-fade" id="textContent"></div>
        </div>
        <div class="next-icon" id="nextBtn" onclick="nextSlide()">🡣</div>
    </div>

    <script>
        // Story Lines specially crafted with the "Roshni" (Light) theme
        const story = [
            "Aap ka naam hi 'Roshni' hai...",
            "Aur sach kahun, aapke aanay se meri life mein waqayi bohat roshni aagayi hai. ✨",
            "Jab aap naraz theen, toh lag raha tha jaise sab kuch andhera sa ho gaya hai.",
            "Lekin aapne mujhe maaf kar ke mera aasmaan wapis chamka diya! 🌌",
            "Aap jaisi caring aur special dost kismat walon ko milti hai.",
            "Meri dua hai ke aapki life hamesha is chamakte hue taaron ki tarah bright rahay. 🌟",
            "Ab ek pyari si smile dein... aur saari tensions bhool jayen.",
            "Khush rahen, abaad rahen!\nGood Night, Sweet Dreams. 🌙\n\n- Aapka dost, Abubakar"
        ];

        let currentIndex = 0;
        let isAnimating = false;

        const introScreen = document.getElementById('introScreen');
        const mainCard = document.getElementById('mainCard');
        const ambientBg = document.getElementById('ambientBg');
        const textContent = document.getElementById('textContent');
        const nextBtn = document.getElementById('nextBtn');
        const firefliesContainer = document.getElementById('fireflies');

        // Function to create magical fireflies
        function createFireflies() {
            for (let i = 0; i < 40; i++) {
                let fly = document.createElement('div');
                fly.classList.add('firefly');
                
                // Random positioning and sizes
                let size = Math.random() * 3 + 1;
                fly.style.width = `${size}px`;
                fly.style.height = `${size}px`;
                fly.style.left = `${Math.random() * 100}vw`;
                fly.style.top = `${Math.random() * 100}vh`;
                
                // Random animation variables
                fly.style.setProperty('--moveX', `${(Math.random() - 0.5) * 100}px`);
                fly.style.setProperty('--moveY', `${(Math.random() - 0.5) * 100 - 50}px`);
                fly.style.setProperty('--duration', `${Math.random() * 4 + 3}s`);
                
                // Staggered appearance
                setTimeout(() => {
                    fly.style.opacity = Math.random() * 0.8 + 0.2;
                }, Math.random() * 2000);

                firefliesContainer.appendChild(fly);
            }
        }

        // Triggered when she taps the intro button
        function startMagic() {
            // Fade out intro
            introScreen.style.opacity = '0';
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                
                // Turn on ambient light and fireflies
                ambientBg.style.opacity = '1';
                createFireflies();

                // Show main card
                mainCard.style.display = 'block';
                setTimeout(() => {
                    mainCard.style.opacity = '1';
                    mainCard.style.transform = 'translateY(0) scale(1)';
                    
                    // Start story
                    showText(0);
                }, 100);
                
            }, 1000);
        }

        function showText(index) {
            textContent.classList.remove('text-visible');
            nextBtn.classList.remove('show');

            setTimeout(() => {
                // Formatting text properly (handling line breaks)
                textContent.innerHTML = story[index].replace(/\n/g, '<br>');
                textContent.classList.add('text-visible');

                // Show next button after text appears
                setTimeout(() => {
                    if (index < story.length - 1) {
                        nextBtn.classList.add('show');
                    } else {
                        // At the last slide
                        document.getElementById('heading').innerText = "Hamesha Khush Rahein 💛";
                        document.getElementById('heading').style.fontSize = "26px";
                        spawnHearts();
                    }
                    isAnimating = false;
                }, 1000); // Delay before showing next button
                
            }, 600); // Delay for fade out
        }

        function nextSlide() {
            if (isAnimating) return;
            isAnimating = true;
            currentIndex++;
            showText(currentIndex);
        }

        // Special effect for the end
        function spawnHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    let heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerText = ['✨', '🌟', '💛', '💫'][Math.floor(Math.random() * 4)];
                    heart.style.left = `${Math.random() * 80 + 10}%`;
                    heart.style.bottom = `-20px`;
                    heart.style.animation = `floatHeart ${Math.random() * 3 + 4}s ease-in forwards`;
                    
                    document.body.appendChild(heart);
                    
                    // Clean up
                    setTimeout(() => heart.remove(), 7000);
                }, i * 300);
            }
        }
    </script>
</body>
</html>
