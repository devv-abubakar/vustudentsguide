<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorry Roshni 🥺</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #e6edf3;
            --accent: #ff4d4d;
            --next-btn: #0072ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-color);
        }

        /* Ambient Emotional Glow */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,77,77,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: breathe 6s infinite alternate ease-in-out;
            z-index: 0;
        }

        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .mobile-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 35px 25px;
            width: 100%;
            min-height: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .emoji-display {
            font-size: 65px;
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }

        .text-display {
            font-size: 21px;
            font-weight: 400;
            line-height: 1.6;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(15px);
            filter: blur(5px);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* Buttons Styling */
        .btn {
            padding: 14px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            margin-top: 20px;
        }

        .btn-next {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
            z-index: 10;
        }

        .btn-next:active {
            transform: scale(0.95);
        }

        .btn-container {
            display: none;
            width: 100%;
            margin-top: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 80px;
        }

        .btn-no {
            background: var(--accent);
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.4);
            position: relative; /* Changes to absolute via JS */
            z-index: 5;
        }

        /* Sneaky Message when clicking No */
        .sneaky-text {
            position: absolute;
            bottom: -40px;
            font-size: 15px;
            color: #ff9999;
            opacity: 0;
            transition: opacity 0.3s;
            font-style: italic;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        /* Progress Line */
        .progress-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="mobile-container" id="mainContainer">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

        <div class="glass-card" id="card">
            <div class="emoji-display" id="emoji">🥺</div>
            <div class="text-display" id="text">Roshni... mujhe aapse kuch kehna hai...</div>
            
            <button class="btn btn-next" id="nextBtn" onclick="nextSlide()">Aage Parhein ➔</button>
            
            <div class="btn-container" id="btnContainer">
                <button class="btn btn-no" id="noBtn">Nahi</button>
                <div class="sneaky-text" id="sneakyText"></div>
            </div>
        </div>
    </div>

    <script>
        const story = [
            { text: "Roshni... mujhe aapse kuch kehna hai...", emoji: "🥺" },
            { text: "Main sach mein majboor tha, aaj aapko time nahi de saka...", emoji: "😔" },
            { text: "Wallah mujhe bohat bura lag raha hai, main bohat udaas hoon ke aap mujhse naraz hain.", emoji: "🥀" },
            { text: "Aapko lagta hai ke sirf aapka dil tha baat karne ka?", emoji: "💔" },
            { text: "Wallah main bohat excited ho jata hoon jab aapse baat start hoti hai...", emoji: "🥹" },
            { text: "Aapse baat karke main apni saari tensions aur pareshaniyan bhool jata hoon.", emoji: "✨" },
            { text: "Aap meri life mein aayi hain toh lagta hai ke life mein kuch interesting hai.", emoji: "💫" },
            { text: "Aap wahid girl ho jisko main sachay dil se dost manta hoon.", emoji: "💖" },
            { text: "Aap bohat achi ho, aur main aapko kabhi khona nahi chahta.", emoji: "🤝" },
            { text: "Kya aap apne is dost ko maaf karengi?", emoji: "🤲" }
        ];

        const noMessages = [
            "Aise mat karo na 🥺", 
            "Please maan jao na 😭", 
            "Nahi par click mat karo! 💔", 
            "Main sachi mein sorry hoon 🥺", 
            "Thora sa toh taras khao 🙈",
            "Aap bohat ziddi ho! 😂",
            "Ab toh haan karni padegi! ✨"
        ];
        let noMsgIndex = 0;

        const textEl = document.getElementById('text');
        const emojiEl = document.getElementById('emoji');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');
        const btnContainer = document.getElementById('btnContainer');
        const noBtn = document.getElementById('noBtn');
        const sneakyText = document.getElementById('sneakyText');
        const card = document.getElementById('card');

        let currentIndex = 0;
        let isAnimating = false;

        // Initial Progress setup
        progressFill.style.width = `${(1 / story.length) * 100}%`;

        function nextSlide() {
            // Prevent multiple clicks while animating
            if (isAnimating) return;
            isAnimating = true;

            // Fade out current text and emoji
            textEl.classList.remove('fade-in');
            textEl.classList.add('fade-out');
            emojiEl.style.opacity = '0';
            emojiEl.style.transform = 'scale(0.8)';

            setTimeout(() => {
                currentIndex++;
                
                // Update text and emoji
                textEl.innerText = story[currentIndex].text;
                emojiEl.innerText = story[currentIndex].emoji;
                
                // Update Progress Bar
                progressFill.style.width = `${((currentIndex + 1) / story.length) * 100}%`;

                // Fade in new text and emoji
                textEl.classList.remove('fade-out');
                textEl.classList.add('fade-in');
                emojiEl.style.opacity = '1';
                emojiEl.style.transform = 'scale(1)';

                isAnimating = false;

                // Check if it's the last slide
                if (currentIndex === story.length - 1) {
                    nextBtn.style.display = "none"; // Hide Next Button
                    btnContainer.style.display = "flex"; // Show No Button area
                    setupDodgeButton();
                }
            }, 400); // 400ms delay for smooth transition
        }

        // --- Dodge "No" Button Logic ---
        function setupDodgeButton() {
            noBtn.addEventListener('touchstart', moveNoBtn, {passive: false});
            noBtn.addEventListener('click', moveNoBtn);
            noBtn.addEventListener('mouseover', moveNoBtn);
        }

        function moveNoBtn(e) {
            e.preventDefault(); 
            
            // Get boundaries of the card
            const cardRect = card.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Calculate safe movement area so it stays inside the glass card
            const maxX = cardRect.width - btnRect.width - 40;
            const maxY = cardRect.height - btnRect.height - 80;

            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2) + 20;
            const randomY = Math.floor(Math.random() * maxY) - (maxY / 2) + 20;

            noBtn.style.position = "absolute";
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

            // Show sneaky text
            sneakyText.innerText = noMessages[noMsgIndex];
            sneakyText.style.opacity = "1";
            noMsgIndex = (noMsgIndex + 1) % noMessages.length;

            setTimeout(() => {
                sneakyText.style.opacity = "0";
            }, 1500);
        }

    </script>
</body>
</html>
