<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Good Night Roshni ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0b0f19;
            --bg-bottom: #1a1543;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-color: #f0f4f8;
            --btn-color: #fbc531;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-color);
            position: relative;
        }

        /* Starry Sky Animation */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 8px white; }
        }

        /* Glowing Moon */
        .moon {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: #fdf5e6;
            border-radius: 50%;
            box-shadow: 0 0 40px #fdf5e6, inset -10px -10px 20px rgba(0,0,0,0.1);
            z-index: 1;
            animation: floatMoon 6s infinite alternate ease-in-out;
        }

        @keyframes floatMoon {
            0% { transform: translateY(0); }
            100% { transform: translateY(15px); }
        }

        .mobile-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Premium Glass Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 40px 25px;
            min-height: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .emoji-display {
            font-size: 70px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .text-display {
            font-size: 22px;
            font-weight: 400;
            line-height: 1.5;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .fade-in {
            opacity: 1;
            transform: scale(1);
        }

        /* Action Button */
        .btn-next {
            background: var(--btn-color);
            color: #111;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 8px 25px rgba(251, 197, 49, 0.4);
            transition: all 0.3s;
        }

        .btn-next:active {
            transform: scale(0.95);
        }

        /* Progress Dots */
        .dots-container {
            display: flex;
            gap: 8px;
            position: absolute;
            bottom: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .dot.active {
            background: var(--btn-color);
            width: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="stars" id="starContainer"></div>
    <div class="moon"></div>

    <div class="mobile-container">
        <div class="glass-card">
            <div class="emoji-display" id="emoji">✨</div>
            <div class="text-display" id="text">Roshni...</div>
            
            <button class="btn-next" id="nextBtn" onclick="nextSlide()">Aage Parhein ➔</button>

            <div class="dots-container" id="dotsContainer"></div>
        </div>
    </div>

    <script>
        // Generating random stars
        const starContainer = document.getElementById('starContainer');
        for (let i = 0; i < 60; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starContainer.appendChild(star);
        }

        // Happy & Sweet Story Array
        const story = [
            { text: "Roshni...", emoji: "✨" },
            { text: "Maaf karne ke liye aapka bohat bohat shukriya!", emoji: "💖" },
            { text: "Sach bataun toh meri life mein sukoon wapis aagaya hai.", emoji: "😌" },
            { text: "Aapki smile aur aapki dosti mere liye bohat keemti hai.", emoji: "🌸" },
            { text: "Aap waqayi bohat special hain, aur hamesha rahengi.", emoji: "🤝" },
            { text: "Ab saari pareshaniyan bhool jayen...", emoji: "🍃" },
            { text: "Aur is pyari si raat mein ek sweet si smile ke sath so jayen.", emoji: "😇" },
            { text: "Sweet Dreams Roshni! Good Night! 🌙\n\n- Aapka dost, Abubakar", emoji: "🌌" }
        ];

        const textEl = document.getElementById('text');
        const emojiEl = document.getElementById('emoji');
        const nextBtn = document.getElementById('nextBtn');
        const dotsContainer = document.getElementById('dotsContainer');

        let currentIndex = 0;
        let isAnimating = false;

        // Create dots for progress
        story.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = `dot ${index === 0 ? 'active' : ''}`;
            dot.id = `dot-${index}`;
            dotsContainer.appendChild(dot);
        });

        function updateDots() {
            document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));
            document.getElementById(`dot-${currentIndex}`).classList.add('active');
        }

        function nextSlide() {
            if (isAnimating) return;
            isAnimating = true;

            // Fade out
            textEl.classList.remove('fade-in');
            textEl.classList.add('fade-out');
            emojiEl.style.opacity = '0';
            emojiEl.style.transform = 'translateY(-20px)';

            setTimeout(() => {
                currentIndex++;
                
                // Update Content
                textEl.innerText = story[currentIndex].text;
                emojiEl.innerText = story[currentIndex].emoji;
                
                updateDots();

                // Fade in
                textEl.classList.remove('fade-out');
                textEl.classList.add('fade-in');
                emojiEl.style.opacity = '1';
                emojiEl.style.transform = 'translateY(0)';

                isAnimating = false;

                // If last slide, hide the button
                if (currentIndex === story.length - 1) {
                    nextBtn.style.display = "none";
                    // Extra magical effect at the end
                    emojiEl.style.filter = "drop-shadow(0 0 30px #fbc531)";
                }
            }, 500); // Wait for fade-out to complete
        }

    </script>
</body>
</html>
