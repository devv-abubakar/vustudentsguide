<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Cute Story ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Baloo 2', cursive;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Mobile Container */
        .story-container {
            width: 90%;
            max-width: 400px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1), inset 0 0 0 8px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Scene Area */
        .scene {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Stickers Styling */
        .stickers-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transition: all 0.5s ease;
        }

        .sticker {
            font-size: 80px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15));
            animation: float 3s ease-in-out infinite alternate;
            position: relative;
        }

        /* Different float timings for stickers */
        .sticker:nth-child(1) { animation-delay: 0s; }
        .sticker:nth-child(2) { animation-delay: 1s; }
        .sticker:nth-child(3) { animation-delay: 0.5s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Action/Thought Bubbles */
        .mini-bubble {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 30px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Text Area */
        .text-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            min-height: 140px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }

        /* Speech tail */
        .text-box::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 15px 15px 15px;
            border-style: solid;
            border-color: transparent transparent white transparent;
        }

        .story-text {
            font-size: 20px;
            line-height: 1.5;
            transition: opacity 0.5s;
        }

        .highlight-text {
            color: #ff4757;
            font-size: 24px;
            font-weight: 700;
        }

        /* Button */
        .next-btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Baloo 2', cursive;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
            width: 80%;
        }

        .next-btn:active {
            transform: scale(0.95);
        }

        /* Entry/Exit Animations */
        .fade-out {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s;
        }
        .fade-in {
            opacity: 1;
            transform: scale(1);
            transition: all 0.4s;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Confetti for the end */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff4757;
            animation: fall linear forwards;
            z-index: 100;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

    </style>
</head>
<body>

    <div class="story-container">
        
        <div class="scene">
            <div class="stickers-wrapper" id="stickers">
                </div>
        </div>

        <div class="text-box">
            <div class="story-text" id="text"></div>
        </div>

        <button class="next-btn" id="btn" onclick="nextScene()">Aage Parhein ➔</button>

    </div>

    <script>
        // Character Definitions
        const Roshni = '👧🏻';
        const Abubakar = '👦🏻';
        const JK = '👱🏼‍♂️';

        const story = [
            {
                text: "Roshni aur Abubakar bohat achay dost the. Lekin Roshni hamesha JK ki baatein karti rehti thi...",
                stickers: `
                    <div class="sticker">${Roshni}<div class="mini-bubble">💬</div></div>
                    <div class="sticker" style="filter: grayscale(100%); opacity: 0.6;">${JK}</div>
                    <div class="sticker">${Abubakar}<div class="mini-bubble">😒</div></div>
                `
            },
            {
                text: "Abubakar ko thori jealousy hoti thi. Phir ek din, JK sach mein Roshni ki life mein aagaya.",
                stickers: `
                    <div class="sticker">${Roshni}</div>
                    <div class="sticker">${JK}<div class="mini-bubble">🌹</div></div>
                    <div class="sticker" style="margin-left: 30px;">${Abubakar}<div class="mini-bubble">💔</div></div>
                `
            },
            {
                text: "Start mein toh Roshni bohat khush thi. Lekin kuch waqt baad, usay ehsas hua ke JK ke sath wo sukoon nahi hai...",
                stickers: `
                    <div class="sticker">${Roshni}<div class="mini-bubble">😔</div></div>
                    <div class="sticker">${JK}<div class="mini-bubble">📱</div></div>
                `
            },
            {
                text: "Wo wahan ho kar bhi khush nahi thi. Uska dil wapis apne sab se achay dost ke paas aane ko chaha.",
                stickers: `
                    <div class="sticker">${Roshni}<div class="mini-bubble">💭👦🏻</div></div>
                `
            },
            {
                text: "Ek din Abubakar akela aur udaas betha tha... tabhi achanak Roshni uske paas aagayi!",
                stickers: `
                    <div class="sticker">${Abubakar}<div class="mini-bubble">😞</div></div>
                    <div class="sticker" style="transform: scaleX(-1);">${Roshni}<div class="mini-bubble">🏃🏻‍♀️</div></div>
                `
            },
            {
                text: "Abubakar usay wapis dekh kar bohat khush hua! Dono ke chehron par ek pyari si smile aagayi.",
                stickers: `
                    <div class="sticker">${Abubakar}<div class="mini-bubble">🥺</div></div>
                    <div class="sticker">${Roshni}<div class="mini-bubble">😊</div></div>
                `
            },
            {
                text: "Toh Roshni ne uski taraf dekha aur bohat pyaar se kaha...",
                stickers: `
                    <div class="sticker">${Abubakar}</div>
                    <div class="sticker">${Roshni}<div class="mini-bubble">✨</div></div>
                `
            },
            {
                text: "<span class='highlight-text'>\"Main thi toh udhar...<br>Lekin sirf aapki yadon mein thi!\"</span> 💖",
                stickers: `
                    <div class="sticker" style="font-size: 100px;">🫂</div>
                `
            },
            {
                text: "Aise unki dosti aur connection pehle se bhi zyada strong ho gaya! <br><br><b>✨ Happy Ending ✨</b>",
                stickers: `
                    <div class="sticker">👦🏻</div>
                    <div class="sticker">💖</div>
                    <div class="sticker">👧🏻</div>
                `,
                isLast: true
            }
        ];

        let currentIndex = 0;
        let isAnimating = false;

        const textEl = document.getElementById('text');
        const stickersEl = document.getElementById('stickers');
        const btn = document.getElementById('btn');

        function loadScene(index) {
            // Fade out
            textEl.classList.remove('fade-in');
            textEl.classList.add('fade-out');
            stickersEl.classList.remove('fade-in');
            stickersEl.classList.add('fade-out');

            setTimeout(() => {
                // Update content
                textEl.innerHTML = story[index].text;
                stickersEl.innerHTML = story[index].stickers;

                // Fade in
                textEl.classList.remove('fade-out');
                textEl.classList.add('fade-in');
                stickersEl.classList.remove('fade-out');
                stickersEl.classList.add('fade-in');

                isAnimating = false;

                if (story[index].isLast) {
                    btn.style.display = 'none';
                    shootConfetti();
                }
            }, 400);
        }

        function nextScene() {
            if (isAnimating) return;
            isAnimating = true;
            currentIndex++;
            loadScene(currentIndex);
        }

        // Confetti logic for Happy Ending
        function shootConfetti() {
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81'];
            for (let i = 0; i < 100; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                document.body.appendChild(confetti);
            }
        }

        // Load first scene on start
        loadScene(0);

    </script>
</body>
</html>
