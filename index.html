<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorry Roshni 🙏</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff0844;
            --text-light: #f8f9fa;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-light);
        }

        /* Ambient Animated Background */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: floatBlob 12s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 {
            width: 250px; height: 250px;
            background: var(--primary);
            top: -50px; left: -50px;
        }

        .blob-2 {
            width: 300px; height: 300px;
            background: var(--secondary);
            bottom: -100px; right: -50px;
            animation-delay: -4s;
        }

        .blob-3 {
            width: 200px; height: 200px;
            background: var(--accent);
            top: 40%; left: 30%;
            animation-duration: 15s;
            opacity: 0.4;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -60px) scale(1.2); }
        }

        /* Mobile Constraint Wrapper */
        .mobile-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            top: 40px;
            width: 85%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            transition: width 0.5s ease;
        }

        /* Advanced Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 25px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 320px;
            justify-content: center;
            position: relative;
        }

        /* Emoji Animation */
        .emoji-wrapper {
            font-size: 70px;
            margin-bottom: 25px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Cinematic Text Reveal */
        .message-text {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 0.5px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.8s ease;
        }

        /* Text States */
        .text-hide {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            filter: blur(8px);
        }

        .text-show {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        /* Material Design Action Button */
        .action-btn {
            margin-top: 30px;
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(255, 8, 68, 0.3);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .action-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Button Pulse Effect */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 8, 68, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 8, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 8, 68, 0); }
        }

        .action-btn.show {
            animation: pulse 2s infinite;
        }

    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="mobile-container">
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="glass-card">
            <div class="emoji-wrapper" id="emojiDisplay">✨</div>
            <div class="message-text text-hide" id="textDisplay"></div>
            
            <button class="action-btn" id="forgiveBtn" onclick="forgiveAction()">
                Maaf Kiya! 💖
            </button>
        </div>

    </div>

    <script>
        // Highly detailed, emotional story array
        const story = [
            { text: "Roshni... Ek chhoti si baat karni thi aap se...", emoji: "🥺" },
            { text: "Pichle kuch dino se aap naraz hain...", emoji: "😔" },
            { text: "Aur sach kahun, toh mera kahin bhi dil nahi lag raha.", emoji: "🥀" },
            { text: "Mujhe apni ghalti ka poora ehsas hai.", emoji: "🙏" },
            { text: "Mera irada aap ko kabhi hurt karne ka nahi tha.", emoji: "💔" },
            { text: "Aap meri bohat pyari aur khaas dost hain.", emoji: "✨" },
            { text: "Kya aap apni is dost ki nadani ko maaf kar sakti hain?", emoji: "🥹" },
            { text: "Please... Maaf kar dein na? Main intazar kar raha hoon...", emoji: "🤲" }
        ];

        const textElement = document.getElementById('textDisplay');
        const emojiElement = document.getElementById('emojiDisplay');
        const progressBar = document.getElementById('progressBar');
        const forgiveBtn = document.getElementById('forgiveBtn');
        
        let currentIndex = 0;
        const intervalTime = 3500; // 3.5 seconds per slide for better reading time

        function updateContent() {
            // Cinematic Fade Out
            textElement.classList.remove('text-show');
            textElement.classList.add('text-hide');
            emojiElement.style.transform = "scale(0.5) rotate(-15deg)";
            emojiElement.style.opacity = "0";

            setTimeout(() => {
                // Update Content
                textElement.innerText = story[currentIndex].text;
                emojiElement.innerText = story[currentIndex].emoji;

                // Update Progress Bar
                const progress = ((currentIndex + 1) / story.length) * 100;
                progressBar.style.width = `${progress}%`;

                // Cinematic Fade In
                textElement.classList.remove('text-hide');
                textElement.classList.add('text-show');
                emojiElement.style.transform = "scale(1) rotate(0deg)";
                emojiElement.style.opacity = "1";

                // Check if it's the last message
                if (currentIndex === story.length - 1) {
                    clearInterval(storyInterval); // Stop the loop
                    setTimeout(() => {
                        forgiveBtn.classList.add('show'); // Show the button
                    }, 1000);
                } else {
                    currentIndex++;
                }
            }, 600); // Wait for fade-out transition
        }

        // Button Action
        function forgiveAction() {
            forgiveBtn.innerText = "Thank You Roshni! ✨";
            forgiveBtn.style.background = "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)";
            textElement.innerText = "Aap ka bohat shukriya! Dosti hamesha zindabad. 🤝";
            emojiElement.innerText = "🎉";
            
            // Add a small celebration pop effect
            emojiElement.style.transform = "scale(1.3)";
            setTimeout(() => { emojiElement.style.transform = "scale(1)"; }, 300);
        }

        // Start the story
        setTimeout(updateContent, 100); // Initial load
        const storyInterval = setInterval(updateContent, intervalTime);

    </script>
</body>
</html>
