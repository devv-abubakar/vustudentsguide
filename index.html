<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VU Exam Reviews - Authentic Student Experiences</title>
    
    <meta name="description" content="Search authentic Midterm and Final Term paper reviews for Virtual University (VU). CS, MGT, ENG courses. Updated 2026.">
    <meta name="keywords" content="VU paper reviews, current paper 2026, virtual university past papers, CS101 review">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a;    /* Dark Blue */
            --accent: #2563eb;     /* Bright Blue */
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
            --ad-placeholder: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); }

        /* --- NAVBAR --- */
        nav {
            background: var(--card-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        .logo span { color: var(--accent); }

        /* --- LAYOUT GRID --- */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1fr 320px; /* Content Left, Ads Right */
            gap: 25px;
        }

        /* --- MAIN CONTENT --- */
        .main-content { min-height: 80vh; }

        /* Search Hero */
        .hero {
            background: linear-gradient(120deg, var(--primary), #1e293b);
            color: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }
        .hero h1 { margin-bottom: 10px; font-size: 1.8rem; }
        .hero p { opacity: 0.8; margin-bottom: 20px; font-size: 0.95rem; }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 15px 25px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Course List */
        .grid-courses {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .course-card {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .course-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .code { font-weight: 700; font-size: 1.1rem; }
        .count { background: #eff6ff; color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }

        /* Review Details */
        #reviewView { display: none; }
        .back-btn { cursor: pointer; color: var(--accent); font-weight: 600; margin-bottom: 15px; display: inline-block; }
        
        .review-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }
        .r-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .r-title { font-weight: 700; font-size: 1rem; }
        .r-text { white-space: pre-wrap; color: #475569; font-size: 0.95rem; }
        .topics { margin-top: 15px; background: #f8fafc; padding: 10px; border-radius: 6px; }
        .tag { display: inline-block; font-size: 0.75rem; background: #e2e8f0; padding: 3px 8px; border-radius: 4px; margin: 2px; }

        /* --- ADVERTISING SLOTS --- */
        .ad-slot {
            background: var(--ad-placeholder);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .ad-top { width: 100%; height: 90px; margin-bottom: 20px; } /* Leaderboard */
        .ad-sidebar { width: 100%; height: 600px; position: sticky; top: 90px; } /* Skyscraper */
        .ad-infeed { width: 100%; height: 250px; margin: 30px 0; border: 1px dashed #cbd5e1; } /* Native */

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .ad-sidebar { display: none; } /* Mobile pe sidebar ad chupana better hai UX k liye */
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">VU<span>Reviews</span></a>
        <a href="https://github.com/devv-abubakar/vustudentsguide" target="_blank"><i class="fab fa-github fa-lg"></i></a>
    </nav>

    <div class="container">
        
        <main class="main-content">
            
            <div class="ad-slot ad-top">
                Top Banner Ad
            </div>

            <div id="homeView">
                <div class="hero">
                    <h1>Find Paper Reviews</h1>
                    <p>Enter your course code to see what others say.</p>
                    <input type="text" id="search" class="search-box" placeholder="e.g. CS101, MGT501..." onkeyup="filterCourses()">
                </div>
                
                <h3 style="margin-bottom:15px; color:var(--primary);">Available Courses</h3>
                <div id="loader" style="text-align:center;">Loading...</div>
                <div id="courseGrid" class="grid-courses"></div>
            </div>

            <div id="reviewView">
                <div class="back-btn" onclick="goHome()">← Back to Search</div>
                <h2 id="courseTitle" style="margin-bottom:20px; font-size:1.8rem;"></h2>
                <div id="reviewsList"></div>
            </div>

        </main>

        <aside>
            <div class="ad-slot ad-sidebar">
                Sticky Sidebar Ad
            </div>
        </aside>

    </div>

    <script>
        let allCourses = [];
        const homeView = document.getElementById('homeView');
        const reviewView = document.getElementById('reviewView');
        const courseGrid = document.getElementById('courseGrid');
        const loader = document.getElementById('loader');

        // Initialize
        window.onload = async () => {
            try {
                // Fetch Index File
                const res = await fetch('all_courses.json');
                allCourses = await res.json();
                loader.style.display = 'none';
                renderCourses(allCourses);

                // Handle URL Direct Link (?code=CS101)
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');
                if (code) {
                    const course = allCourses.find(c => c.code === code.toUpperCase());
                    if (course) loadReviews(course.filename, course.code);
                }
            } catch (err) {
                loader.innerHTML = 'Error loading data. Try refreshing.';
            }
        };

        // Render Courses List
        function renderCourses(list) {
            courseGrid.innerHTML = '';
            list.forEach(c => {
                const div = document.createElement('div');
                div.className = 'course-card';
                div.onclick = () => {
                    window.history.pushState({}, '', `?code=${c.code}`);
                    loadReviews(c.filename, c.code);
                };
                div.innerHTML = `<span class="code">${c.code}</span><span class="count">${c.count}</span>`;
                courseGrid.appendChild(div);
            });
        }

        // Search Filter
        function filterCourses() {
            const query = document.getElementById('search').value.toUpperCase();
            const filtered = allCourses.filter(c => c.code.includes(query));
            renderCourses(filtered);
        }

        // Load Reviews for a Course
        async function loadReviews(filename, code) {
            homeView.style.display = 'none';
            reviewView.style.display = 'block';
            document.querySelector('.hero').style.display = 'none'; // Hide search on detail page
            
            document.getElementById('courseTitle').innerText = `${code} Reviews`;
            const container = document.getElementById('reviewsList');
            container.innerHTML = 'Loading...';

            try {
                // IMPORTANT: Fetching from REVIEWS folder
                const res = await fetch(`reviews/${filename}`);
                const data = await res.json();
                
                container.innerHTML = '';

                let adCounter = 0;

                data.reviews.forEach(r => {
                    // Inject Ad after every 3 reviews
                    adCounter++;
                    if (adCounter === 4) {
                        const adDiv = document.createElement('div');
                        adDiv.className = 'ad-slot ad-infeed';
                        adDiv.innerText = 'In-Feed Ad';
                        container.appendChild(adDiv);
                        adCounter = 0;
                    }

                    // Render Review
                    const div = document.createElement('div');
                    div.className = 'review-card';
                    
                    let topics = '';
                    if (r.topicsList && r.topicsList.length > 0) {
                        topics = `<div class="topics"><strong>Key Topics:</strong><br>${r.topicsList.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
                    }

                    div.innerHTML = `
                        <div class="r-header">
                            <span class="r-title">${r.reviewHeading}</span>
                            <small>${r.difficulty || ''}</small>
                        </div>
                        <div class="r-text">${r.reviewText}</div>
                        ${topics}
                    `;
                    container.appendChild(div);
                });

            } catch (err) {
                container.innerHTML = 'Error loading reviews.';
            }
        }

        // Back Button
        function goHome() {
            reviewView.style.display = 'none';
            homeView.style.display = 'block';
            document.querySelector('.hero').style.display = 'block';
            window.history.pushState({}, '', window.location.pathname);
        }
    </script>

</body>
</html>
