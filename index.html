<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dudu ki Tension 🍜</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: #ffecd2;
            background: linear-gradient(135deg, #fcb69f 0%, #ffecd2 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
        }

        /* Noodle Rain Container */
        #noodleRain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .noodle-drop {
            position: absolute;
            font-size: 30px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Main Comic Card */
        .comic-card {
            background: #ffffff;
            border: 4px solid #333;
            border-radius: 30px;
            width: 90%;
            max-width: 380px;
            height: 70vh;
            position: relative;
            z-index: 10;
            box-shadow: 8px 8px 0px #333; /* Hard comic shadow */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Avatar / Emoji Area */
        .avatar-area {
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .emoji-char {
            font-size: 80px;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
        }

        /* Funny Animations for Emoji */
        .fat-emoji {
            transform: scale(1.4) scaleX(1.5); /* Makes it wide/fat */
        }

        .thin-emoji {
            transform: scale(0.9) scaleX(0.4); /* Makes it super thin */
        }

        .shake-emoji {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Speech Bubble Text */
        .speech-bubble {
            background: #f1f2f6;
            border: 3px solid #333;
            border-radius: 20px;
            padding: 20px;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 15px 15px 15px;
            border-style: solid;
            border-color: transparent transparent #333 transparent;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 12px 12px 12px;
            border-style: solid;
            border-color: transparent transparent #f1f2f6 transparent;
        }

        .text-content {
            opacity: 1;
            transition: opacity 0.3s;
        }

        .text-hide {
            opacity: 0;
        }

        /* Next Button */
        .btn-next {
            margin-top: 20px;
            background: #ff4757;
            color: white;
            border: 3px solid #333;
            padding: 12px 30px;
            font-size: 20px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #333;
            transition: all 0.1s;
            width: 80%;
        }

        .btn-next:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #333;
        }

        .highlight {
            color: #ff4757;
            font-size: 26px;
        }

    </style>
</head>
<body>

    <div id="noodleRain"></div>

    <div class="comic-card" id="card">
        <div class="avatar-area">
            <div class="emoji-char" id="emoji">☀️</div>
        </div>
        
        <div class="speech-bubble">
            <div class="text-content" id="text">Subah Bakhair Bubu! Uth jao!</div>
        </div>

        <button class="btn-next" id="nextBtn" onclick="nextSlide()">Aage Parho ➔</button>
    </div>

    <script>
        // Story Array with actions for animations
        const story = [
            { text: "Subah Bakhair Bubu! Uth jao! ☀️", emoji: "👧🏻" },
            { text: "Tumhara Dudu subah subah ek bohat bari tension mein utha hai...", emoji: "🧑🏻‍🦱💆🏻‍♂️", action: "shake" },
            { text: "Tension yeh hai ke tum dhang ka khana kyun nahi khati? Sirf <span class='highlight'>NOODLES!</span> 🍜", emoji: "🥢", action: "rain" },
            { text: "Mujhe samajh nahi aati main kis cheez ki tension loon...", emoji: "🤯" },
            { text: "Is baat ki ke noodles kha kha kar tum Bubu se <span class='highlight'>'Gol Matol Bubu'</span> ban jaogi? 🐡😂", emoji: "👧🏻", action: "fat" },
            { text: "Ya is baat ki... ke acha khana na kha kar tum bilkul <span class='highlight'>Kamzor si Teeli</span> ho jaogi? 🥀🥺", emoji: "👧🏻", action: "thin" },
            { text: "Dudu ki baat mano, aaj koi acha aur healthy sa khana kha lena please? 🥗🍖", emoji: "🙏", action: "normal" },
            { text: "Warna main khud aa kar zabardasti khilaunga! Love you Bubu! 💖🏃🏻‍♂️", emoji: "💖", isLast: true }
        ];

        let currentIndex = 0;
        let isAnimating = false;

        const textEl = document.getElementById('text');
        const emojiEl = document.getElementById('emoji');
        const card = document.getElementById('card');
        const nextBtn = document.getElementById('nextBtn');

        function nextSlide() {
            if (isAnimating) return;
            isAnimating = true;

            // Animate Card bounce
            card.style.transform = "scale(0.95)";
            setTimeout(() => { card.style.transform = "scale(1)"; }, 150);

            // Fade out text
            textEl.classList.add('text-hide');

            setTimeout(() => {
                currentIndex++;
                const currentSlide = story[currentIndex];

                // Update content
                textEl.innerHTML = currentSlide.text;
                emojiEl.innerText = currentSlide.emoji;

                // Handle Custom Funny Actions
                emojiEl.className = 'emoji-char'; // Reset classes
                if (currentSlide.action === "fat") {
                    emojiEl.classList.add('fat-emoji');
                } else if (currentSlide.action === "thin") {
                    emojiEl.classList.add('thin-emoji');
                } else if (currentSlide.action === "shake") {
                    emojiEl.classList.add('shake-emoji');
                } else if (currentSlide.action === "rain") {
                    startNoodleRain();
                }

                // Fade in text
                textEl.classList.remove('text-hide');

                if (currentSlide.isLast) {
                    nextBtn.style.display = 'none';
                    stopNoodleRain();
                    card.style.borderColor = "#ff4757";
                    card.style.boxShadow = "8px 8px 0px #ff4757";
                }

                isAnimating = false;
            }, 300);
        }

        // Noodle Rain Logic
        let rainInterval;
        const rainContainer = document.getElementById('noodleRain');

        function createNoodle() {
            const noodle = document.createElement('div');
            noodle.classList.add('noodle-drop');
            // Randomly pick between noodle bowl or chopsticks
            noodle.innerText = Math.random() > 0.5 ? '🍜' : '🍝'; 
            noodle.style.left = Math.random() * 100 + 'vw';
            noodle.style.animationDuration = (Math.random() * 2 + 2) + 's'; // 2s to 4s
            noodle.style.fontSize = (Math.random() * 20 + 20) + 'px'; // 20px to 40px
            
            rainContainer.appendChild(noodle);

            // Remove after animation ends
            setTimeout(() => {
                noodle.remove();
            }, 4000);
        }

        function startNoodleRain() {
            if(!rainInterval) {
                rainInterval = setInterval(createNoodle, 200); // Drop a noodle every 200ms
            }
        }

        function stopNoodleRain() {
            clearInterval(rainInterval);
            rainInterval = null;
        }

    </script>
</body>
</html>
