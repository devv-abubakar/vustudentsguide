<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorry Roshni 🥺</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Material Design inspired gradient */
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        /* Mobile Container Constraint */
        .mobile-app {
            width: 100%;
            height: 100%;
            max-width: 420px; /* Restricts to mobile width even on desktop */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        /* Floating Animation for the top icon */
        .icon-container {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Message Box styling */
        .message-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 20px;
            width: 100%;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .text-content {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.5;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }

        /* Utility classes for JS animation */
        .fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* Decorative glowing orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            z-index: -1;
            opacity: 0.6;
        }
        .orb-1 {
            width: 150px; height: 150px;
            background: #ff758c;
            top: 10%; left: -20%;
            animation: moveOrb 8s alternate infinite;
        }
        .orb-2 {
            width: 200px; height: 200px;
            background: #ff7eb3;
            bottom: 10%; right: -20%;
            animation: moveOrb 10s alternate-reverse infinite;
        }

        @keyframes moveOrb {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

    </style>
</head>
<body>

    <div class="mobile-app">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="icon-container" id="emoji">
            🥺
        </div>

        <div class="message-box">
            <div class="text-content" id="dynamicText">
                Hey Roshni...
            </div>
        </div>
    </div>

    <script>
        // Array of messages that will change every 3 seconds
        const messages = [
            "Hey Roshni...",
            "Mujhe pata hai main ghalat tha...",
            "Aur mera irada tumhe hurt karna bilkul nahi tha.",
            "I am really, really sorry! 😔",
            "Tum meri bohat achi dost ho...",
            "Meri ghalti ko maaf kar do na?",
            "Promise, aage se aesa nahi hoga. 🤝",
            "Friends again? ✨"
        ];

        // Emojis matching the mood of the text
        const emojis = ["🥺", "😔", "💔", "🙏", "💖", "🥹", "🤝", "😊"];

        const textElement = document.getElementById('dynamicText');
        const emojiElement = document.getElementById('emoji');
        let currentIndex = 0;

        function changeContent() {
            // Step 1: Fade out the current text
            textElement.classList.remove('fade-in');
            textElement.classList.add('fade-out');

            // Step 2: Wait for fade out to complete, then change text and fade in
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % messages.length;
                
                textElement.innerText = messages[currentIndex];
                emojiElement.innerText = emojis[currentIndex];

                textElement.classList.remove('fade-out');
                textElement.classList.add('fade-in');
            }, 500); // 500ms matches the CSS transition time
        }

        // Change text every 3.5 seconds (3s display + 0.5s transition)
        setInterval(changeContent, 3500);
    </script>

</body>
</html>
