<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise For Roshni 🎈</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           ADVANCED CSS ARCHITECTURE & VARIABLES
           ========================================= */
        :root {
            --bg-gradient-start: #ff9a9e;
            --bg-gradient-end: #fecfef;
            --card-glass: rgba(255, 255, 255, 0.4);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-dark: #2d3436;
            --text-light: #636e72;
            --btn-bg: #ff7675;
            --btn-hover: #d63031;
            --bubble-1: rgba(255, 118, 117, 0.7);
            --bubble-2: rgba(116, 185, 255, 0.7);
            --bubble-3: rgba(162, 155, 254, 0.7);
            --bubble-4: rgba(253, 203, 110, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Canvas for Confetti & Particles */
        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
        }

        /* =========================================
           SCENE 1: BUBBLE POP GAME
           ========================================= */
        #gameScene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 1s ease;
        }

        .game-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
            animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bubble-container {
            position: relative;
            width: 100%;
            height: 60vh;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: transform 0.2s;
            animation: float 4s ease-in-out infinite alternate;
        }

        .bubble:active {
            transform: scale(0.9);
        }

        /* Bubble popping animation */
        .pop-anim {
            animation: popOut 0.3s forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(10deg); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* =========================================
           SCENE 2: STORY CARD (3D TILT)
           ========================================= */
        #storyScene {
            position: relative;
            z-index: 30;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: none;
            opacity: 0;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--card-border);
            border-radius: 35px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 400px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .emoji-wrapper {
            font-size: 75px;
            margin-bottom: 20px;
            transform: translateZ(50px); /* 3D effect */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .text-wrapper {
            transform: translateZ(30px); /* 3D effect */
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            color: var(--text-dark);
            line-height: 1.5;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .sub-text {
            font-size: 16px;
            color: var(--text-light);
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 1s forwards 0.5s;
        }

        .text-hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
        }

        .text-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Playful Button */
        .btn-playful {
            margin-top: 30px;
            background: var(--btn-bg);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 118, 117, 0.4), inset 0 -4px 0 rgba(0,0,0,0.1);
            cursor: pointer;
            transform: translateZ(40px); /* 3D effect */
            transition: all 0.2s;
        }

        .btn-playful:active {
            transform: translateZ(40px) translateY(4px);
            box-shadow: 0 5px 10px rgba(255, 118, 117, 0.4), inset 0 0px 0 rgba(0,0,0,0.1);
        }

        /* Progress Tracker */
        .progress-container {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            transform: translateZ(20px);
        }

        .heart-dot {
            font-size: 14px;
            opacity: 0.3;
            transition: all 0.4s;
            filter: grayscale(100%);
        }

        .heart-dot.active {
            opacity: 1;
            transform: scale(1.5);
            filter: grayscale(0%);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <canvas id="fxCanvas"></canvas>

    <div id="gameScene">
        <h1 class="game-title" id="gameTitle">Roshni, In 3 balloons ko phoriye! 🎈</h1>
        <div class="bubble-container" id="bubbleContainer"></div>
    </div>

    <div id="storyScene">
        <div class="glass-card" id="tiltCard">
            <div class="emoji-wrapper" id="emoji">✨</div>
            <div class="text-wrapper">
                <div class="main-text text-hidden" id="text"></div>
            </div>
            
            <button class="btn-playful" id="nextBtn" onclick="nextSlide()">Aage Chalein 🐾</button>

            <div class="progress-container" id="progressDots"></div>
        </div>
    </div>

    <script>
        /* =========================================
           ADVANCED JAVASCRIPT LOGIC & PHYSICS
           ========================================= */

        // --- DOM Elements ---
        const gameScene = document.getElementById('gameScene');
        const bubbleContainer = document.getElementById('bubbleContainer');
        const gameTitle = document.getElementById('gameTitle');
        const storyScene = document.getElementById('storyScene');
        const tiltCard = document.getElementById('tiltCard');
        const textEl = document.getElementById('text');
        const emojiEl = document.getElementById('emoji');
        const nextBtn = document.getElementById('nextBtn');
        const progressDots = document.getElementById('progressDots');

        // --- State Variables ---
        let bubblesToPop = 3;
        let poppedCount = 0;
        let currentIndex = 0;
        let isAnimating = false;

        // --- Story Data ---
        const story = [
            { text: "Tadaaa! 🎉", emoji: "✨" },
            { text: "Aapne mujhe maaf kar ke mera din bana diya! Sach mein!", emoji: "🎈" },
            { text: "Pata hai? Aapki smile kisi bhi udaas din ko roshan kar sakti hai.", emoji: "🌻" },
            { text: "Aap jaisi achi aur caring dost milna sach mein ek blessing hai.", emoji: "🤲" },
            { text: "Main hamesha koshish karunga ke aapke chehre par aisi hi muskurahat rahe.", emoji: "🧸" },
            { text: "Ab ek pyari si smile dein... Haan, bilkul aise!", emoji: "😊" },
            { text: "Hamesha khush rahen, Roshni! 💖\n\n- Abubakar", emoji: "🌌" }
        ];

        /* -----------------------------------------
           PART 1: THE BUBBLE POP GAME ENGINE
           ----------------------------------------- */
        const bubbleColors = ['var(--bubble-1)', 'var(--bubble-2)', 'var(--bubble-3)', 'var(--bubble-4)'];
        const bubbleEmojis = ['🎈', '🧸', '💖', '🌻', '🌸'];

        function initBubbles() {
            for(let i=0; i<5; i++) {
                createBubble();
            }
        }

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            // Random styling
            const size = Math.floor(Math.random() * 40) + 70; // 70px to 110px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            const color = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
            bubble.style.background = color;
            
            bubble.innerText = bubbleEmojis[Math.floor(Math.random() * bubbleEmojis.length)];
            
            // Random positioning inside container
            bubble.style.left = `${Math.floor(Math.random() * 70)}%`;
            bubble.style.top = `${Math.floor(Math.random() * 70)}%`;
            
            // Random float animation delay
            bubble.style.animationDelay = `${Math.random() * 2}s`;

            // Pop Event
            bubble.addEventListener('touchstart', (e) => popBubble(e, bubble), {passive: false});
            bubble.addEventListener('click', (e) => popBubble(e, bubble));

            bubbleContainer.appendChild(bubble);
        }

        function popBubble(e, element) {
            e.preventDefault();
            if(element.classList.contains('pop-anim')) return;

            // Trigger Pop Animation
            element.classList.add('pop-anim');
            poppedCount++;

            // Update Game Title
            const remaining = bubblesToPop - poppedCount;
            if(remaining > 0) {
                gameTitle.innerText = `Great! Ab ${remaining} aur phoriye! 🎈`;
                gameTitle.style.animation = 'none';
                void gameTitle.offsetWidth; // trigger reflow
                gameTitle.style.animation = 'bounceIn 0.5s';
            } else if (remaining === 0) {
                gameTitle.innerText = "Yay! Perfect! ✨";
                setTimeout(transitionToStory, 800);
            }

            // Remove element after animation
            setTimeout(() => {
                element.remove();
            }, 300);
        }

        /* -----------------------------------------
           PART 2: TRANSITION & STORY LOGIC
           ----------------------------------------- */
        function transitionToStory() {
            gameScene.style.opacity = '0';
            setTimeout(() => {
                gameScene.style.display = 'none';
                storyScene.style.display = 'block';
                
                // Trigger Fade In for Story
                setTimeout(() => {
                    storyScene.style.opacity = '1';
                    setupStoryDots();
                    showStory(0);
                    initTiltEffect();
                }, 100);
            }, 1000);
        }

        function setupStoryDots() {
            story.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = 'heart-dot';
                dot.innerHTML = '❤️';
                dot.id = `dot-${idx}`;
                progressDots.appendChild(dot);
            });
        }

        function showStory(index) {
            // Hide current
            textEl.classList.remove('text-visible');
            textEl.classList.add('text-hidden');
            emojiEl.style.transform = "translateZ(50px) scale(0.5) rotate(-20deg)";
            emojiEl.style.opacity = "0";

            setTimeout(() => {
                // Update content
                textEl.innerText = story[index].text;
                emojiEl.innerText = story[index].emoji;

                // Update Dots
                document.querySelectorAll('.heart-dot').forEach(d => {
                    d.classList.remove('active');
                    d.style.filter = "grayscale(100%)";
                });
                const activeDot = document.getElementById(`dot-${index}`);
                activeDot.classList.add('active');
                activeDot.style.filter = "grayscale(0%)";

                // Show new
                textEl.classList.remove('text-hidden');
                textEl.classList.add('text-visible');
                emojiEl.style.transform = "translateZ(50px) scale(1) rotate(0deg)";
                emojiEl.style.opacity = "1";

                isAnimating = false;

                // Handle Last Slide
                if(index === story.length - 1) {
                    nextBtn.style.display = "none";
                    emojiEl.classList.add('pop-anim');
                    setTimeout(() => {
                        emojiEl.classList.remove('pop-anim');
                        emojiEl.style.filter = "drop-shadow(0 0 20px rgba(255,105,180,0.8))";
                    }, 300);
                    // Trigger massive confetti
                    fireConfetti();
                }
            }, 400);
        }

        function nextSlide() {
            if(isAnimating) return;
            isAnimating = true;
            currentIndex++;
            
            // Add a playful button bounce
            nextBtn.style.transform = "translateZ(40px) scale(0.9)";
            setTimeout(() => {
                nextBtn.style.transform = "translateZ(40px) scale(1)";
            }, 150);

            showStory(currentIndex);
        }

        /* -----------------------------------------
           PART 3: 3D TILT EFFECT (Vanilla JS Physics)
           ----------------------------------------- */
        function initTiltEffect() {
            // Mouse movement for desktop
            document.addEventListener('mousemove', handleTilt);
            // Device orientation for mobile (if granted)
            window.addEventListener('deviceorientation', handleDeviceTilt);
        }

        function handleTilt(e) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            tiltCard.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }

        function handleDeviceTilt(e) {
            if(!e.beta || !e.gamma) return;
            // Limit the rotation so it doesn't flip over
            const x = Math.max(-15, Math.min(15, e.gamma / 2));
            const y = Math.max(-15, Math.min(15, (e.beta - 45) / 2));
            tiltCard.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        }

        /* -----------------------------------------
           PART 4: HIGH-PERFORMANCE CANVAS CONFETTI
           ----------------------------------------- */
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ff7675', '#74b9ff', '#a29bfe', '#fdcb6e', '#55efc4', '#ffeaa7'];

        class Particle {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2 + 100; // Start from button area
                this.size = Math.random() * 10 + 5;
                this.speedX = Math.random() * 20 - 10; // Wide spread
                this.speedY = Math.random() * -20 - 5; // Shoot up
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.gravity = 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                this.opacity = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity; // Gravity pull
                this.rotation += this.rotationSpeed;
                this.opacity -= 0.005; // Slowly fade out
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;
                // Draw a random shape (square or circle)
                if (Math.random() > 0.5) {
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function handleParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                // Remove invisible particles
                if(particles[i].opacity <= 0 || particles[i].y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(handleParticles);
        }

        function fireConfetti() {
            // Generate 200 particles
            for(let i=0; i<200; i++) {
                particles.push(new Particle());
            }
            handleParticles(); // Start animation loop
            
            // Extra bursts
            setTimeout(() => {
                for(let i=0; i<100; i++) particles.push(new Particle());
            }, 500);
            setTimeout(() => {
                for(let i=0; i<100; i++) particles.push(new Particle());
            }, 1000);
        }

        // Handle Window Resize for Canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize Game
        initBubbles();

    </script>
</body>
</html>
