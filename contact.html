<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - VU Students Guide</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">VU<span>StudentsGuide</span></a>
        <div class="menu-icon" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="reviews.html">Reviews</a>
            <a href="papers.html">Papers</a>
            <a href="contact.html" style="color:var(--primary);">Contact</a>
            <a href="#" class="btn-nav">Get App</a>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-grid">
            
            <div class="contact-info">
                <h1>Let's Chat<br><span>About Exams</span></h1>
                <p>Have a question, suggestion, or want to submit your own paper review? We'd love to hear from you.</p>
                
                <div class="info-item">
                    <div class="info-icon"><i class="fas fa-envelope"></i></div>
                    <div>
                        <h4 style="margin-bottom:2px;">Email Us</h4>
                        <span style="color:#64748b;">support@vustudentsguide.com</span>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon"><i class="fab fa-whatsapp"></i></div>
                    <div>
                        <h4 style="margin-bottom:2px;">WhatsApp Community</h4>
                        <span style="color:#64748b;">Join Group (Coming Soon)</span>
                    </div>
                </div>
            </div>

            <div class="contact-form-box">
                <form action="mailto:your-email@gmail.com" method="post" enctype="text/plain">
                    <div class="form-group">
                        <label class="form-label">Your Name</label>
                        <input type="text" class="form-input" placeholder="e.g. Ali Khan" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" placeholder="name@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea class="form-input" rows="4" placeholder="Type your message here..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Send Message <i class="fas fa-paper-plane" style="margin-left:8px;"></i></button>
                </form>
            </div>

        </div>
    </section>

    <script>
        function toggleMenu() {
            const nav = document.querySelector('.nav-links');
            nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
            if(nav.style.display === 'flex') {
                nav.style.flexDirection = 'column';
                nav.style.position = 'absolute';
                nav.style.top = '100%';
                nav.style.left = '0';
                nav.style.width = '100%';
                nav.style.background = 'white';
                nav.style.padding = '20px';
                nav.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)';
            }
        }
    </script>
</body>
</html>
