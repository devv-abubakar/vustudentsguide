<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - VU Students Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">VU<span>StudentsGuide</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="reviews.html">Reviews</a>
            <a href="papers.html">Past Papers</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <section>
        <div class="contact-form">
            <h2 style="margin-bottom:20px; text-align:center;">Get in Touch</h2>
            <form action="mailto:your-email@gmail.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 VU Students Guide</p>
    </footer>

</body>
</html>
