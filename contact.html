<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - VU Students Guide</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">VU<span>StudentsGuide</span></a>
        <div class="menu-icon" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div class="nav-links">
            <a href="index.html">Home</a>

        </div>
    </nav>

    <section style="padding:50px 20px;">
        <div class="center-box">
            <h1 style="color:var(--secondary); margin-bottom:10px;">Get in Touch</h1>
            <p style="color:var(--text-light); margin-bottom:30px;">Have questions? Email us at <strong style="color:var(--primary);">vuguide360@gmail.com</strong></p>
            
            <form action="mailto:vuguide360@gmail.com" method="post" enctype="text/plain">
                <input type="text" class="form-input" placeholder="Your Name" required>
                <input type="email" class="form-input" placeholder="Your Email" required>
                <textarea class="form-input" rows="5" placeholder="Your Message..." required></textarea>
                <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer;">Send Message</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
