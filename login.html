<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VU Examination System - Login</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body { 
            background-color: #f8f9fc; 
            padding-top: 8rem; 
            font-family: 'Poppins', sans-serif; 
        }
        
        .m-portlet { 
            background: #fff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            max-width: 550px; 
            margin: auto; 
            border-radius: 12px;
            overflow: hidden;
            border: none;
        }
        
        .m-portlet__head { 
            background: linear-gradient(135deg, #2f74ad 0%, #151f2f 100%); 
            padding: 25px; 
            color: white; 
            text-align: center; 
        }
        
        .m-portlet__head h3 {
            font-weight: 700;
            margin-bottom: 0;
            font-size: 1.5rem;
        }
        
        .m-portlet__body { 
            padding: 35px; 
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            height: auto;
            border: 1px solid #ebedf2;
            background-color: #f8f9fc;
            font-size: 1rem;
        }
        
        .form-control:focus {
            box-shadow: none;
            border-color: #2f74ad;
            background-color: #fff;
        }
        
        .info-notice {
            background-color: #e0f0ff;
            color: #154c79;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2f74ad;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .btn-primary {
            background-color: #2f74ad;
            border-color: #2f74ad;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1.05rem;
        }
        
        .btn-primary:hover {
            background-color: #151f2f;
            border-color: #151f2f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .form-group label {
            font-weight: 600; 
            color: #494b74;
        }
        
        .alert-danger {
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="m-portlet">
            <div class="m-portlet__head">
                <h3><i class="fas fa-lock mr-2"></i> Exam Login</h3>
            </div>
            <div class="m-portlet__body">
                
                <div class="info-notice">
                    <i class="fas fa-info-circle mr-1"></i>
                    <strong>Important:</strong> Idhar apni real VU Student ID se login na karein. Test book karny k baad apko jo <strong>Test Username aur Password</strong> mila ha, sirf usi se login karein.
                </div>

                <div id="divError" class="alert alert-danger" style="display:none;"></div>
                
                <div class="form-group mb-4">
                    <label>Test Username</label>
                    <input id="txtUsername" type="text" class="form-control" placeholder="Enter provided username (e.g., BC240200001)">
                </div>
                
                <div class="form-group mb-4">
                    <label>Test Password</label>
                    <input id="txtPassword" type="password" class="form-control" placeholder="Enter provided password">
                </div>
                
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="index.html" class="text-muted" style="font-weight: 500; text-decoration: none; transition: color 0.3s;">
                        <i class="fas fa-arrow-left mr-1"></i> Back to Home
                    </a>
                    <button id="btnLogin" class="btn btn-primary" onclick="attemptLogin()">
                        Login <i class="fas fa-sign-in-alt ml-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nddzwzfiklulmyzteeoh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UNo59RPkC8sL9fbArltEug_STep04lA";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Array shuffler (Fisher-Yates) for random questions
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function attemptLogin() {
            const username = document.getElementById('txtUsername').value.trim();
            const password = document.getElementById('txtPassword').value.trim();
            const errorDiv = document.getElementById('divError');

            // 1. Basic Input Validation
            if (!username || !password) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Please enter both Username and Password.';
                return;
            }

            errorDiv.style.display = 'none';
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Verifying...';
            btn.disabled = true;

            // 2. Fetch Student Data (Joined with Course Data)
            const { data: student, error } = await supabaseClient
                .from('paper_students')
                .select('*, paper_courses(id, code, title)')
                .eq('username', username)
                .eq('password', password)
                .single();

            // 3. Credentials Check
            if (error || !student) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Invalid Username or Password.';
                btn.innerHTML = 'Login <i class="fas fa-sign-in-alt ml-1"></i>';
                btn.disabled = false;
                return;
            }

            // 4. Completed Check from Students Table
            if (student.is_completed) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> <strong>Test Already Completed!</strong> Aap yeh test pehlay hi submit kar chukay hain.';
                btn.innerHTML = 'Login <i class="fas fa-sign-in-alt ml-1"></i>';
                btn.disabled = false;
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Preparing Exam...';

            // 5. Check for Existing Active Session
            const { data: existingSession, error: checkErr } = await supabaseClient
                .from('paper_test_sessions')
                .select('*')
                .eq('user_id', student.username)
                .eq('course_id', student.course_id)
                .single();

            let sessionId;

            if (existingSession) {
                // Check if session was marked completed
                if (existingSession.status === 'completed') {
                    errorDiv.style.display = 'block';
                    errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> <strong>Test Already Completed!</strong> Aap yeh test pehlay hi submit kar chukay hain.';
                    btn.innerHTML = 'Login <i class="fas fa-sign-in-alt ml-1"></i>';
                    btn.disabled = false;
                    return;
                }
                // Resume existing session
                sessionId = existingSession.id;
            } else {
                // 6. Create NEW Session
                const { data: newSession, error: insertErr } = await supabaseClient
                    .from('paper_test_sessions')
                    .insert([{ 
                        user_id: student.username, 
                        course_id: student.course_id, 
                        status: 'active',
                        time_remaining_seconds: student.total_time_minutes * 60,
                        current_question_index: 0
                    }]).select().single();

                if (insertErr) {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = 'Server error: Session creation failed. Please try again.';
                    btn.innerHTML = 'Login <i class="fas fa-sign-in-alt ml-1"></i>';
                    btn.disabled = false;
                    return;
                }
                sessionId = newSession.id;

                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Generating Paper...';

                // 7. THE MAGIC: Random Question Extraction & Locking
                const { data: allQs, error: fetchQsErr } = await supabaseClient
                    .from('paper_questions')
                    .select('id, question_type')
                    .eq('course_id', student.course_id)
                    .eq('exam_type', student.exam_type);
                
                if (allQs && allQs.length > 0) {
                    // Filter by type, shuffle randomly, and pick exact count specified for this student
                    let mcqs = shuffleArray(allQs.filter(q => q.question_type === 'mcq')).slice(0, student.mcq_count);
                    let shorts = shuffleArray(allQs.filter(q => q.question_type === 'short')).slice(0, student.short_count);
                    let longs = shuffleArray(allQs.filter(q => q.question_type === 'long')).slice(0, student.long_count);
                    
                    // Combine them (MCQs first, then Short, then Long)
                    let selectedQs = [...mcqs, ...shorts, ...longs];
                    
                    // Format for insertion
                    let assignmentData = selectedQs.map((q, index) => ({
                        session_id: sessionId,
                        question_id: q.id,
                        order_no: index + 1
                    }));

                    // Lock questions in database for this session
                    if (assignmentData.length > 0) {
                        await supabaseClient.from('paper_assigned_questions').insert(assignmentData);
                    }
                }
            }

            // 8. Set Session Storage Variables for test.html engine
            sessionStorage.setItem('vu_session_id', sessionId);
            sessionStorage.setItem('vu_user_id', student.username);
            sessionStorage.setItem('vu_user_name', student.name);
            sessionStorage.setItem('vu_username', student.username);
            sessionStorage.setItem('vu_course_id', student.course_id);
            sessionStorage.setItem('vu_course_code', student.paper_courses.code);
            sessionStorage.setItem('vu_course_title', student.paper_courses.title);
            
            // 9. Final Redirect
            window.location.href = 'test.html';
        }
    </script>
</body>
</html>
