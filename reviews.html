<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reviews - VU Students Guide</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">VU<span>StudentsGuide</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="reviews.html" class="active">Reviews</a>
            <a href="papers.html">Past Papers</a>
            <a href="contact.html">Contact</a>
            <a href="#" class="btn-app">Get App</a>
        </div>
    </nav>

    <div class="sponsor-box box-wide" style="margin-top:20px;">Header Ad</div>

    <section>
        <div class="dashboard-layout">
            <main>
                <div id="searchView">
                    <h2>Search Paper Reviews</h2>
                    <input type="text" id="searchInput" class="search-bar" placeholder="Enter Course Code (e.g. CS101)...">
                    <div id="loader" style="text-align:center;">Loading...</div>
                    <div id="courseGrid" class="grid"></div>
                </div>

                <div id="detailView" class="hidden">
                    <button onclick="goBack()" style="background:none; border:none; cursor:pointer; color:var(--primary); margin-bottom:15px;">
                        ← Back to Search
                    </button>
                    <h1 id="courseTitle"></h1>
                    <div id="reviewsList"></div>
                </div>
            </main>

            <aside>
                <div class="sponsor-box box-tall">Sidebar Ad</div>
            </aside>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 VU Students Guide</p>
    </footer>

    <script src="script.js"></script> 
</body>
</html>
