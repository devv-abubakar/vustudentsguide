<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Reviews - VU Students Guide</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4950618030310002"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4950618030310002">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">VU<span>StudentsGuide</span></a>
        <div class="menu-icon" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="reviews.html" class="active">Reviews</a>
            <a href="papers.html">Papers</a>
            <a href="contact.html">Contact</a>
            <a href="#" class="btn-nav">Get App</a>
        </div>
    </nav>

    <div class="dashboard-layout">
        
        <main>
            <div class="ad-slot ad-header">Header Ad Slot</div>

            <div id="searchView">
                <h2 style="color:var(--secondary); margin-bottom:20px;">Find Paper Reviews</h2>
                
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-bar" placeholder="Enter Course Code (e.g. CS101)...">
                </div>

                <div id="loader" style="text-align:center; color:var(--text-light); margin:20px;">Loading data...</div>
                <div id="courseGrid" class="grid"></div>
            </div>

            <div id="detailView" style="display:none;">
                <button onclick="goBack()" class="btn-secondary" style="margin-bottom:20px; border:none; padding-left:0; background:transparent; box-shadow:none;">
                    <i class="fas fa-arrow-left"></i> Back to Search
                </button>
                
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h1 id="detailHeaderTitle" style="color:var(--secondary); font-size:2.5rem;">CODE</h1>
                </div>

                <div id="reviewsList"></div>
            </div>
        </main>

        <aside>
            <div class="ad-slot ad-sidebar">Sticky Sidebar Ad</div>
        </aside>

    </div>

    <script src="script.js"></script>
</body>
</html>
